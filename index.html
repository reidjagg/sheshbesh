<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Шешбеш редактор</title>
  <style>
    html {
      touch-action: manipulation;
      background: var(--bg);
      color-scheme: dark;
    }

    :root {
      /* Lichess-like page shell (SVG board markup unchanged) */
      --bg: #262421;
      --text: #ececea;
      --accent: #629924;
      --ui-surface: #3c3a37;
      --ui-surface-2: #454240;
      --ui-border: #5c5a57;
      --ui-text: #ececea;
      --ui-btn: #4a4845;
      --ui-btn-border: #6d6a67;
      --ui-btn-hover: #52504c;
      --ui-input-bg: #2f2d2b;
      --ui-input-border: #5a5653;
      --ui-chip-inner: #343230;
      --ui-active: #2a3228;
      --ui-active-border: #629924;
      --panel-font: Arial, Helvetica, sans-serif;
      --panel-font-size: 14px;
      --panel-line-height: 1.35;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: var(--panel-font);
      background: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      body {
        align-items: stretch;
        padding: 0;
      }

      .actions,
      .panel-modes,
      .panel-dice {
        width: 100%;
        max-width: 100%;
        border: none;
        border-radius: 0;
        box-sizing: border-box;
        padding-left: 0;
        padding-right: 0;
      }

      .actions--toolbar {
        margin-top: 0;
      }

      .actions--setup {
        margin-top: 4px;
        margin-bottom: 4px;
      }

      .panel-modes,
      .panel-dice {
        margin-top: 4px;
      }

      #boardSvg {
        align-self: stretch;
        margin: 0;
        max-width: none;
      }
    }

    #boardSvg {
      width: 808px;
      height: auto;
      display: block;
      margin: 0 auto;
      align-self: center;
      max-width: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    svg text {
      user-select: none;
      -webkit-user-select: none;
    }

    .point-label {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      user-select: none;
      padding: 6px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      background: var(--ui-surface);
      color: var(--ui-text);
      font-family: var(--panel-font);
      font-size: var(--panel-font-size);
      line-height: var(--panel-line-height);
    }

    .actions--setup {
      margin-top: 6px;
      margin-bottom: 6px;
    }

    .actions--toolbar {
      margin-top: 6px;
      align-self: center;
    }

    .actions button {
      padding: 8px 12px;
      border: 1px solid var(--ui-btn-border);
      border-radius: 6px;
      background: var(--ui-btn);
      color: var(--ui-text);
      cursor: pointer;
      font: inherit;
    }

    .actions button:hover {
      background: var(--ui-btn-hover);
    }

    .actions button.active {
      border-color: var(--ui-active-border);
      box-shadow: inset 0 0 0 1px var(--ui-active-border);
      background: var(--ui-active);
    }

    #togglePointLabelsBtn:active {
      background: var(--ui-btn);
      border-color: var(--ui-btn-border);
      box-shadow: none;
    }

    #togglePointLabelsBtn:focus {
      outline: none;
    }

    #togglePointLabelsBtn:focus-visible {
      outline: 2px solid var(--ui-btn-border);
      outline-offset: 2px;
    }

    .panel-modes {
      margin-top: 6px;
      display: grid;
      gap: 4px;
      padding: 6px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      background: var(--ui-surface);
      color: var(--ui-text);
      user-select: none;
      font-family: var(--panel-font);
      font-size: var(--panel-font-size);
      line-height: var(--panel-line-height);
    }

    .panel-dice {
      margin-top: 6px;
      display: grid;
      gap: 4px;
      padding: 6px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      background: var(--ui-surface);
      color: var(--ui-text);
      user-select: none;
      font-family: var(--panel-font);
      font-size: var(--panel-font-size);
      line-height: var(--panel-line-height);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .mode-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border: 1px solid var(--ui-btn-border);
      border-radius: 6px;
      background: var(--ui-btn);
      color: var(--ui-text);
      cursor: pointer;
      user-select: none;
      font: inherit;
    }

    .mode-btn:hover {
      background: var(--ui-btn-hover);
    }

    .mode-btn.active {
      border-color: var(--ui-active-border);
      box-shadow: inset 0 0 0 1px var(--ui-active-border);
      background: var(--ui-active);
      color: var(--ui-text);
    }

    .checker-icon {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid #222;
      display: inline-block;
      box-sizing: border-box;
    }

    .checker-icon--white {
      background: var(--checker-white-bg, #ffffff);
      border-color: var(--checker-white-bd, #111111);
    }

    .checker-icon--black {
      background: var(--checker-black-bg, #0d0d14);
      border-color: var(--checker-black-bd, #e9c891);
    }

    .hover-zone {
      fill: #fff;
      opacity: 0;
      cursor: inherit;
      transition: opacity 120ms ease-out;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    /* :hover on touch (first tap) stole the gesture; only dim on real hover. */
    @media (hover: hover) and (pointer: fine) {
      .hover-zone:hover {
        opacity: 0.1;
      }
    }

    .scale-input {
      width: 70px;
      padding: 5px 6px;
      border: 1px solid var(--ui-input-border);
      border-radius: 4px;
      background: var(--ui-input-bg);
      color: var(--ui-text);
    }

    input[type="number"],
    select {
      padding: 4px 6px;
      border: 1px solid var(--ui-input-border);
      border-radius: 4px;
      background: var(--ui-input-bg);
      color: var(--ui-text);
    }

    .control-like {
      height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--ui-input-border);
      border-radius: 6px;
      background: var(--ui-input-bg);
      color: var(--ui-text);
      box-sizing: border-box;
      font: inherit;
    }

    select.control-like {
      min-width: 72px;
      cursor: pointer;
    }

    input.control-like {
      width: 90px;
    }

    .value-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      background: var(--ui-surface-2);
      color: var(--ui-text);
      box-sizing: border-box;
      font: inherit;
      line-height: var(--panel-line-height);
    }

    .value-chip .control-like {
      height: 28px;
      min-width: 58px;
      padding: 4px 4px;
      border: 1px solid var(--ui-input-border);
      border-radius: 6px;
      background: var(--ui-chip-inner);
      color: var(--ui-text);
      line-height: var(--panel-line-height);
    }

    .board-palette-wrap {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 24px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .board-palette-trigger {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 1px solid var(--ui-input-border);
      border-radius: 4px;
      background: var(--ui-chip-inner);
      cursor: pointer;
      position: relative;
      box-sizing: border-box;
    }

    .board-palette-trigger:focus-visible {
      outline: 2px solid var(--ui-text);
      outline-offset: 2px;
    }

    .board-palette-swatch {
      position: absolute;
      inset: 1px;
      border-radius: 3px;
      box-sizing: border-box;
      pointer-events: none;
      background: linear-gradient(to right, #c9b797 50%, #ff4422 50%);
    }

    .board-palette-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      left: auto;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px;
      margin: 0;
      list-style: none;
      background: var(--ui-surface-2);
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      box-sizing: border-box;
    }

    .board-palette-dropdown[hidden] {
      display: none !important;
    }

    .board-palette-option {
      display: block;
      width: 52px;
      height: 22px;
      margin: 0;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      box-sizing: border-box;
      background-clip: padding-box;
    }

    .board-palette-option:hover {
      filter: brightness(1.06);
    }

    .board-palette-option[aria-selected="true"] {
      border-color: var(--ui-text);
    }

    .board-palette-option:focus-visible {
      outline: 2px solid var(--ui-text);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div class="actions actions--toolbar" aria-label="Экспорт и вид доски">
      <button id="exportPngBtn" type="button">💾</button>
      <button id="flipBoardBtn" type="button">🔄</button>
      <button id="togglePointLabelsBtn" type="button">🔢</button>
      <button id="zoomOutBtn" type="button">🔍</button>
      <button id="zoomInBtn" type="button">🔎</button>
      <div class="value-chip board-palette-chip">
        <div class="board-palette-wrap">
          <input type="hidden" id="boardPaletteKeyInput" value="classic" />
          <button
            type="button"
            id="paletteMenuBtn"
            class="board-palette-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="paletteMenuDropdown"
            title="Цветовая тема доски и шашек"
            aria-label="Выбор палитры доски"
          >
            <span id="paletteSwatchPreview" class="board-palette-swatch" aria-hidden="true"></span>
          </button>
          <div id="paletteMenuDropdown" class="board-palette-dropdown" role="listbox" hidden aria-label="Палитры"></div>
        </div>
      </div>
    </div>

    <div class="actions actions--setup" aria-label="Расстановка и отмена">
      <button id="clearBtn" type="button">❌</button>
      <button id="setupLongBtn" type="button">Длинные⚡</button>
      <button id="setupShortBtn" type="button">Короткие⚡</button>
      <button id="backBtn" class="mode-btn" type="button">Вернуть↩️</button>
    </div>

    <div class="panel-modes" aria-label="Режимы редактирования">
      <div class="row">
        <button id="modeMoveBtn" class="mode-btn active" type="button" data-mode="move">Ход 👣</button>
        <button id="modeLinesBtn" class="mode-btn" type="button" data-mode="lines">◀︎━▶︎</button>

  <script>

      /** SVG MENU: поле #403b54, треугольники #8657a7 / #9f744a, белые #fff, тёмные по умолчанию чёрные */
      menu: {
        frame: "#0c0a12",
        frameStroke: "#000000",
        field: "#403b54",
        triA: "#8657a7",
        triB: "#9f744a",
        corner: "#0c0a12",
        rail: "#08060e",
        checkerWhiteFill: "#ffffff",
        checkerWhiteStroke: "#8657a7",
        checkerWhiteText: "#403b54",
        checkerBlackFill: "#0d0d14",
        checkerBlackStroke: "#9f744a",
        checkerBlackText: "#ffffff",
        cubeFill: "#8657a7",
        cubeStroke: "#9f744a",
        cubeText: "#ffffff"
      },
      /** Светлое дерево: бук/дуб, тёплые бежи и мёд */
      lightWood: {
        frame: "#b8966f",
        frameStroke: "#4e3d2a",
        field: "#d8c4a8",
        triA: "#f0e4d2",

        cubeFill: "#cfa06a",

      }

    function getActivePalette() {
      const v = boardPaletteKeyInput && boardPaletteKeyInput.value;
      const key = v && v in boardPalettes ? v : "classic";
      return boardPalettes[key];
    }

    function applyCheckerThemeCss(p) {
      const root = document.documentElement;
      root.style.setProperty("--checker-white-bg", p.checkerWhiteFill);
      root.style.setProperty("--checker-white-bd", p.checkerWhiteStroke);
      root.style.setProperty("--checker-black-bg", p.checkerBlackFill);
      root.style.setProperty("--checker-black-bd", p.checkerBlackStroke);
    }

    function applyBoardPalette(paletteKey) {
      const key = paletteKey in boardPalettes ? paletteKey : "classic";
      if (boardPaletteKeyInput) {
        boardPaletteKeyInput.value = key;
      }
      const p = boardPalettes[key];
      applyCheckerThemeCss(p);
      const frame = boardContent.querySelector('[data-board="frame"]');
      if (frame) {
        frame.setAttribute("fill", p.frame);
        frame.setAttribute("stroke", p.frameStroke);
      }
      boardContent.querySelectorAll('[data-board="field"]').forEach((el) => {
        el.setAttribute("fill", p.field);
      });
      boardContent.querySelectorAll('[data-board="corner"]').forEach((el) => {
        el.setAttribute("fill", p.corner);
      });
      boardContent.querySelectorAll('[data-board="rail"]').forEach((el) => {
        el.setAttribute("fill", p.rail);
      });
      if (boardTriangleFields) {
        boardTriangleFields.querySelectorAll('[data-tri="a"]').forEach((el) => {
          el.setAttribute("fill", p.triA);
        });
        boardTriangleFields.querySelectorAll('[data-tri="b"]').forEach((el) => {
          el.setAttribute("fill", p.triB);
        });
      }
      if (paletteSwatchPreview) {
        paletteSwatchPreview.style.background = `linear-gradient(to right, ${p.triA} 50%, ${p.triB} 50%)`;
      }
      syncPaletteMenuOptions();
    }

    function syncPaletteMenuOptions() {
      if (!paletteMenuDropdown || !boardPaletteKeyInput) {
        return;
      }
      const current = boardPaletteKeyInput.value;
      paletteMenuDropdown.querySelectorAll(".board-palette-option").forEach((opt) => {
        opt.setAttribute("aria-selected", opt.dataset.paletteKey === current ? "true" : "false");
      });
    }

    function setPaletteMenuOpen(open) {
      if (!paletteMenuDropdown || !paletteMenuBtn) {
        return;
      }
      paletteMenuDropdown.hidden = !open;
      paletteMenuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    function chooseBoardPaletteKey(key) {
      const k = key in boardPalettes ? key : "classic";
      applyBoardPalette(k);
      setPaletteMenuOpen(false);
      try {
        localStorage.setItem(BOARD_PALETTE_STORAGE_KEY, k);
      } catch (_) {
        /* ignore */
      }
      renderBoard();
      applyMode(editMode);
    }

    function buildPaletteMenu() {
      if (!paletteMenuDropdown) {
        return;
      }
      paletteMenuDropdown.innerHTML = "";
      PALETTE_MENU_ORDER.forEach((paletteKey) => {
        if (!(paletteKey in boardPalettes)) {
          return;
        }
        const p = boardPalettes[paletteKey];
        const opt = document.createElement("button");
        opt.type = "button";
        opt.setAttribute("role", "option");
        opt.className = "board-palette-option";
        opt.dataset.paletteKey = paletteKey;
        opt.setAttribute("aria-selected", "false");
        opt.style.background = `linear-gradient(to right, ${p.triA} 50%, ${p.triB} 50%)`;
        opt.setAttribute("aria-label", PALETTE_OPTION_LABELS[paletteKey] || paletteKey);
        opt.addEventListener("click", (event) => {
          event.stopPropagation();
          chooseBoardPaletteKey(paletteKey);
        });
        paletteMenuDropdown.appendChild(opt);
      });
    }

    function initBoardPaletteFromStorage() {
      let stored = null;
      try {
        stored = localStorage.getItem(BOARD_PALETTE_STORAGE_KEY);
      } catch (_) {
        /* ignore */
      }
      if (stored === "main") {
        stored = "maket";
      }
      const key = stored && stored in boardPalettes ? stored : "classic";
      applyBoardPalette(key);
      try {
        localStorage.setItem(BOARD_PALETTE_STORAGE_KEY, key);
      } catch (_) {
        /* ignore */
      }
    }

    buildPaletteMenu();

    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const exportPngBtn = document.getElementById("exportPngBtn");
    const flipBoardBtn = document.getElementById("flipBoardBtn");
    const togglePointLabelsBtn = document.getElementById("togglePointLabelsBtn");
    const backBtn = document.getElementById("backBtn");
    const clearBtn = document.getElementById("clearBtn");
    const setupLongBtn = document.getElementById("setupLongBtn");
    const setupShortBtn = document.getElementById("setupShortBtn");
    const dieOneInput = document.getElementById("dieOneInput");
    const dieTwoInput = document.getElementById("dieTwoInput");

    const modeButtons = {

      black: document.getElementById("modeBlackBtn"),
      lines: document.getElementById("modeLinesBtn"),

      delete: document.getElementById("modeDeleteBtn")

    const baseBoardWidth = 808;
    const radius = 21.284;
    const defaultStep = radius * 2 + 1;
    const maxTowerSpan = defaultStep * 4;
    const cellWidth = 47.167;
    const arrowStartWidth = cellWidth;
    const arrowEndWidth = cellWidth * 0.1;
    let isBoardFlipped = false;
    let arePointLabelsVisible = true;
    let editMode = "move";
    let isDeleteDragging = false;
    let activeDeletePointIndex = null;
    let deleteHoldTimer = null;
    let currentBoardScale = 60;
    const editHistory = [];
    const redoHistory = [];
    let diceSnapshot = { die1: "0", die2: "0", cube: "0" };
    const arrows = [];
    let nextArrowId = 1;
    let lineStartPointIndex = null;
    let moveStartPointId = null;
    let isMoveAnimating = false;
    let moveInFlight = null;
    const pendingTowerShiftAnimations = new Map();
    const barStacks = {
      top: [],
      bottom: []
    };
    const barX = 562;
    const barTopY = 115.333;
    const barBottomY = 441.667;

    const leftXs = [273.583, 320.75, 367.917, 415.083, 462.25, 509.417];
    const rightXs = [614.583, 661.75, 708.917, 756.083, 803.25, 850.417];
    const topStartY = 45.583;
    const bottomStartY = 511.417;
    const pointLabelTopY = "11.5";
    const pointLabelBottomY = "546.5";

    const pointDefs = [
      ...[...rightXs].reverse().map((x) => ({ x, startY: topStartY, direction: 1 })),
      ...[...leftXs].reverse().map((x) => ({ x, startY: topStartY, direction: 1 })),
      ...leftXs.map((x) => ({ x, startY: bottomStartY, direction: -1 })),
      ...rightXs.map((x) => ({ x, startY: bottomStartY, direction: -1 }))
    ];

    const pointStacks = Array.from({ length: 24 }, () => []);

    function cursorSvg(color, stroke, glyph = "") {
      const text = glyph ? `<text x='12' y='14' font-size='12'>${glyph}</text>` : "";
      return `data:image/svg+xml;utf8,${encodeURIComponent(
        `<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'>
          <circle cx='11' cy='11' r='8' fill='${color}' stroke='${stroke}' stroke-width='2'/>
          ${text}
        </svg>`
      )}`;
    }

    function whiteArrowCursorSvg() {
      return `data:image/svg+xml;utf8,${encodeURIComponent(
        `<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'>
          <path d='M2 2 L21 11 L13 12.5 L16.2 22 L12.6 23 L9.4 13.4 L2 2 Z' fill='#ffffff' stroke='#1f1f1f' stroke-width='1.2' stroke-linejoin='round'/>
        </svg>`
      )}`;
    }

    function getModeCursorMap() {
      const p = getActivePalette();
      return {
        white: `url("${cursorSvg(p.checkerWhiteFill, p.checkerWhiteStroke)}") 11 11, pointer`,
        black: `url("${cursorSvg(p.checkerBlackFill, p.checkerBlackStroke)}") 11 11, pointer`,
        lines: `url("${whiteArrowCursorSvg()}") 2 2, pointer`,
        move: "default",
        delete: `url("${cursorSvg("#ffd9d9", "#994444")}") 11 11, pointer`
      };
    }

    function applyMode(mode) {
      editMode = mode;
      Object.entries(modeButtons).forEach(([name, btn]) => {
        btn.classList.toggle("active", name === mode);
      });
      document.body.style.cursor = getModeCursorMap()[mode];
      arrowHitLayer.setAttribute("pointer-events", mode === "delete" ? "auto" : "none");
      if (mode !== "lines") {
        lineStartPointIndex = null;
      }
      if (mode !== "move") {
        moveStartPointId = null;
      }
      renderBoard();
    }

    function checkerStyleForColor(color) {
      const p = getActivePalette();
      return color === "white"
        ? { fill: p.checkerWhiteFill, stroke: p.checkerWhiteStroke, textColor: p.checkerWhiteText }
        : { fill: p.checkerBlackFill, stroke: p.checkerBlackStroke, textColor: p.checkerBlackText };
    }

    function clampInt(value, min, max, fallback) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) {
        return fallback;
      }
      return Math.max(min, Math.min(max, parsed));
    }

    function applyTextFlipCompensation(textNode) {
      const x = Number.parseFloat(textNode.getAttribute("x"));
      const y = Number.parseFloat(textNode.getAttribute("y"));
      if (!Number.isFinite(x) || !Number.isFinite(y)) {
        return;
      }
      if (isBoardFlipped) {
        textNode.setAttribute("transform", `rotate(180 ${x} ${y})`);
        return;
      }
      textNode.removeAttribute("transform");
    }

    function getCheckerAnimatedDeltaY(point, stackLength, i, animation) {
      if (!animation) {
        return 0;
      }
      const step = getTowerStep(stackLength);
      const oldStep = getTowerStep(animation.fromCount);
      const cy = point.startY + point.direction * i * step;
      let fromCy = cy;
      if (i < animation.fromCount) {
        fromCy = point.startY + point.direction * i * oldStep;
      } else {
        const prevTopIndex = Math.max(0, animation.fromCount - 1);
        fromCy = point.startY + point.direction * prevTopIndex * oldStep;
      }
      return fromCy - cy;
    }

    function addCountLabel(x, y, count, textColor, startOffsetY) {
      const text = document.createElementNS(svgNs, "text");
      text.setAttribute("x", String(x));
      text.setAttribute("y", String(y));
      text.setAttribute("fill", textColor);
      text.setAttribute("font-size", "22");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "middle");
      text.setAttribute("font-family", "Arial");
      text.setAttribute("font-weight", "bold");
      text.textContent = String(count);
      applyTextFlipCompensation(text);

      const doOffset = Number.isFinite(startOffsetY) && Math.abs(startOffsetY) > 0.01;
      if (doOffset) {
        const g = document.createElementNS(svgNs, "g");
        g.appendChild(text);
        g.style.transition = "none";
        g.style.transform = `translateY(${startOffsetY}px)`;
        requestAnimationFrame(() => {
          g.style.transition = "transform 500ms cubic-bezier(0.22, 1, 0.36, 1)";
          g.style.transform = "translateY(0px)";
        });
        countLabelsLayer.appendChild(g);
        return;
      }
      countLabelsLayer.appendChild(text);
    }

    function getTowerStep(count) {
      if (count <= 1) {
        return defaultStep;
      }
      if (count <= 5) {
        return defaultStep;
      }
      return Math.min(defaultStep, maxTowerSpan / (count - 1));
    }

    function drawTower(pointIndex, stack) {
      if (stack.length === 0) {
        return;
      }
      const point = pointDefs[pointIndex];
      const topColor = stack[stack.length - 1];
      const style = checkerStyleForColor(topColor);
      const step = getTowerStep(stack.length);
      let topX = point.x;
      let topY = point.startY;
      const animation = pendingTowerShiftAnimations.get(pointIndex) || null;
      const oldStep = animation ? getTowerStep(animation.fromCount) : step;

      for (let i = 0; i < stack.length; i += 1) {
        const isHiddenMovingTargetChecker = moveInFlight
          && moveInFlight.toPointId === String(pointIndex)
          && i === stack.length - 1;
        if (isHiddenMovingTargetChecker) {
          continue;
        }
        const cx = point.x;
        const cy = point.startY + point.direction * i * step;
        const currentStyle = checkerStyleForColor(stack[i]);
        topX = cx;
        topY = cy;
        const circle = document.createElementNS(svgNs, "circle");
        circle.setAttribute("cx", String(cx));
        circle.setAttribute("cy", String(cy));
        circle.setAttribute("r", String(radius));
        circle.setAttribute("fill", currentStyle.fill);
        const isMoveSelected =
          editMode === "move" &&
          moveStartPointId === String(pointIndex) &&
          i === stack.length - 1;
        circle.setAttribute("stroke", isMoveSelected ? "#0077FF" : currentStyle.stroke);
        circle.setAttribute("stroke-width", isMoveSelected ? "5" : "3");
        if (isMoveSelected) {
          circle.setAttribute("stroke-dasharray", "9 6");
          const spin = document.createElementNS(svgNs, "animateTransform");
          spin.setAttribute("attributeName", "transform");
          spin.setAttribute("type", "rotate");
          spin.setAttribute("from", `0 ${cx} ${cy}`);
          spin.setAttribute("to", `360 ${cx} ${cy}`);
          spin.setAttribute("dur", "2800ms");
          spin.setAttribute("repeatCount", "indefinite");
          circle.appendChild(spin);
        }
        if (animation) {
          let fromCy = cy;
          if (i < animation.fromCount) {
            fromCy = point.startY + point.direction * i * oldStep;
          } else {
            const prevTopIndex = Math.max(0, animation.fromCount - 1);
            fromCy = point.startY + point.direction * prevTopIndex * oldStep;
          }
          const deltaY = fromCy - cy;
          if (Math.abs(deltaY) > 0.01) {
            circle.style.transform = `translateY(${deltaY}px)`;
            circle.style.transition = "none";
            requestAnimationFrame(() => {
              circle.style.transition = "transform 500ms cubic-bezier(0.22, 1, 0.36, 1)";
              circle.style.transform = "translateY(0px)";
            });
          }
        }
        checkersLayer.appendChild(circle);
      }

      if (stack.length > 5) {
        const fixedLabelY = point.startY + point.direction * maxTowerSpan;
        const shrinkAnim =
          animation && animation.fromCount > stack.length ? animation : null;
        const topIdx = stack.length - 1;
        const labelStartOffsetY = shrinkAnim
          ? getCheckerAnimatedDeltaY(point, stack.length, topIdx, shrinkAnim)
          : 0;
        addCountLabel(topX, fixedLabelY, stack.length, style.textColor, labelStartOffsetY);
      }
    }

    function drawBarCheckers() {
      const barOrder = [
        { section: "top", y: barTopY },
        { section: "bottom", y: barBottomY }
      ];

      barOrder.forEach(({ section, y }) => {
        const stack = barStacks[section];
        const count = stack.length;
        if (count === 0) {
          return;
        }
        if (moveInFlight && moveInFlight.toPointId === `bar-${section}` && count === 1) {
          return;
        }
        const color = stack[count - 1];
        const style = checkerStyleForColor(color);
        const circle = document.createElementNS(svgNs, "circle");
        circle.setAttribute("cx", String(barX));
        circle.setAttribute("cy", String(y));
        circle.setAttribute("r", String(radius));
        circle.setAttribute("fill", style.fill);
        const isMoveSelected =
          editMode === "move" &&
          moveStartPointId === `bar-${section}`;
        circle.setAttribute("stroke", isMoveSelected ? "#0077FF" : style.stroke);
        circle.setAttribute("stroke-width", isMoveSelected ? "5" : "3");
        if (isMoveSelected) {
          circle.setAttribute("stroke-dasharray", "9 6");
          const spin = document.createElementNS(svgNs, "animateTransform");
          spin.setAttribute("attributeName", "transform");
          spin.setAttribute("type", "rotate");
          spin.setAttribute("from", `0 ${barX} ${y}`);
          spin.setAttribute("to", `360 ${barX} ${y}`);
          spin.setAttribute("dur", "2800ms");
          spin.setAttribute("repeatCount", "indefinite");
          circle.appendChild(spin);
        }
        checkersLayer.appendChild(circle);
        if (count > 1) {
          addCountLabel(barX, y, count, style.textColor);
        }
      });
    }

    function createPointLabels() {
      pointLabelsLayer.replaceChildren();
      pointDefs.forEach((point, idx) => {
        const text = document.createElementNS(svgNs, "text");
        text.setAttribute("x", String(point.x));
        text.setAttribute("y", point.direction === 1 ? pointLabelTopY : pointLabelBottomY);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "central");
        text.setAttribute("fill", "#e8eaff");
        text.setAttribute("font-size", "11");
        text.setAttribute("font-family", "Arial");
        text.setAttribute("class", "point-label");
        text.textContent = String(idx + 1);
        applyTextFlipCompensation(text);
        pointLabelsLayer.appendChild(text);
      });
    }

    function syncPointLabelsVisibility() {
      pointLabelsLayer.setAttribute("visibility", arePointLabelsVisible ? "visible" : "hidden");
    }

    function drawDie(x, y, value) {
      const dieSize = 36.75;
      const cornerRadius = 3.675;
      const pipRadius = 3.675;
      const offsetSmall = dieSize * (7.6 / 35);
      const offsetMid = dieSize * 0.5;
      const offsetLarge = dieSize * (27.4 / 35);

      const die = document.createElementNS(svgNs, "rect");
      die.setAttribute("x", String(x));
      die.setAttribute("y", String(y));
      die.setAttribute("width", String(dieSize));
      die.setAttribute("height", String(dieSize));
      die.setAttribute("rx", String(cornerRadius));
      die.setAttribute("ry", String(cornerRadius));
      die.setAttribute("fill", "#fff");
      die.setAttribute("stroke", "#ccc");
      die.setAttribute("stroke-width", "1");
      extrasLayer.appendChild(die);

      const positions = {
        tl: [x + offsetSmall, y + offsetSmall],
        tc: [x + offsetMid, y + offsetSmall],
        tr: [x + offsetLarge, y + offsetSmall],
        ml: [x + offsetSmall, y + offsetMid],
        mc: [x + offsetMid, y + offsetMid],
        mr: [x + offsetLarge, y + offsetMid],
        bl: [x + offsetSmall, y + offsetLarge],
        bc: [x + offsetMid, y + offsetLarge],
        br: [x + offsetLarge, y + offsetLarge]
      };

      const map = {
        1: ["mc"],
        2: ["tl", "br"],
        3: ["tl", "mc", "br"],
        4: ["tl", "tr", "bl", "br"],
        5: ["tl", "tr", "mc", "bl", "br"],
        6: ["tl", "tr", "ml", "mr", "bl", "br"]
      };

      map[value].forEach((key) => {
        const [cx, cy] = positions[key];
        const pip = document.createElementNS(svgNs, "circle");
        pip.setAttribute("cx", String(cx));
        pip.setAttribute("cy", String(cy));
        pip.setAttribute("r", String(pipRadius));
        pip.setAttribute("fill", "#0d0d14");
        extrasLayer.appendChild(pip);
      });
    }

    function drawDoublingCube(value) {
      const pal = getActivePalette();
      const cube = document.createElementNS(svgNs, "rect");
      cube.setAttribute("x", "539.5");
      cube.setAttribute("y", "256.5");
      cube.setAttribute("width", "45");
      cube.setAttribute("height", "45");
      cube.setAttribute("rx", "4");
      cube.setAttribute("ry", "4");
      cube.setAttribute("fill", pal.cubeFill);
      cube.setAttribute("stroke", pal.cubeStroke);
      cube.setAttribute("stroke-width", "2");
      extrasLayer.appendChild(cube);

      const text = document.createElementNS(svgNs, "text");
      text.setAttribute("x", "562");
      text.setAttribute("y", "279");
      text.setAttribute("dy", "5");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", pal.cubeText);
      text.setAttribute("font-size", "20");
      text.setAttribute("font-weight", "bold");
      text.textContent = String(value);
      applyTextFlipCompensation(text);
      extrasLayer.appendChild(text);
    }

    function getPointTopCheckerAnchor(pointIndex) {
      const point = pointDefs[pointIndex];
      const stack = pointStacks[pointIndex];
      const step = stack.length <= 5 ? defaultStep : Math.min(defaultStep, maxTowerSpan / (stack.length - 1));
      const checkerTopY = stack.length > 0
        ? point.startY + point.direction * (stack.length - 1) * step
        : point.startY;
      return { x: point.x, y: checkerTopY };
    }

    function getAnchorForArrow(targetId, isEndAnchor = false) {
      if (targetId === "bar-top" || targetId === "bar-bottom") {
        const stack = barStacks[targetId === "bar-top" ? "top" : "bottom"];
        const y = targetId === "bar-top" ? barTopY : barBottomY;
        if (stack.length > 0) {
          if (isEndAnchor) {
            return { x: barX, y: y - radius };
          }
          return { x: barX, y };
        }
        const emptyBarOffset = cellWidth * 0.1;
        return { x: barX, y: isEndAnchor ? y - emptyBarOffset : y };
      }

      const pointIndex = Number(targetId);
      if (!Number.isInteger(pointIndex) || pointIndex < 0 || pointIndex >= pointDefs.length) {
        return { x: barX, y: 279 };
      }
      const point = pointDefs[pointIndex];
      const stack = pointStacks[pointIndex];
      if (stack.length > 0) {
        const topChecker = getPointTopCheckerAnchor(pointIndex);
        if (isEndAnchor) {
          return {
            x: topChecker.x,
            y: topChecker.y + point.direction * radius
          };
        }
        return topChecker;
      }
      // For empty points, end anchor sits slightly above triangle edge.
      const emptyEndOffset = cellWidth * 0.1;
      return {
        x: point.x,
        y: point.direction === 1
          ? (isEndAnchor ? 22 + emptyEndOffset : 22)
          : (isEndAnchor ? 535 - emptyEndOffset : 535)
      };
    }

    function getArrowGeometry(fromTargetId, toTargetId) {
      const from = getAnchorForArrow(fromTargetId, false);
      const to = getAnchorForArrow(toTargetId, true);
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const distance = Math.hypot(dx, dy) || 1;
      const midX = (from.x + to.x) / 2;
      const midY = (from.y + to.y) / 2;
      const centerX = 562;
      const centerY = 279;
      const centerLinePoint = { x: centerX, y: from.y };
      const toCenterLineX = centerLinePoint.x - from.x;
      const toCenterLineY = centerLinePoint.y - from.y;
      const toCenterLineLen = Math.hypot(toCenterLineX, toCenterLineY);
      const startDir = toCenterLineLen > 0.001
        ? { x: toCenterLineX / toCenterLineLen, y: toCenterLineY / toCenterLineLen }
        : { x: dx / distance, y: dy / distance };
      const towardCenterX = centerX - midX;
      const towardCenterY = centerY - midY;
      const towardCenterLen = Math.hypot(towardCenterX, towardCenterY) || 1;
      const ux = towardCenterX / towardCenterLen;
      const uy = towardCenterY / towardCenterLen;
      const curve = Math.min(220, Math.max(56, distance * 0.52));
      const baseControlX = midX + ux * (curve * 0.58);
      const baseControlY = midY + uy * (curve * 0.58);
      const startLock = 24;
      const cx = (baseControlX * 0.72) + ((from.x + startDir.x * startLock) * 0.28);
      const cy = (baseControlY * 0.72) + ((from.y + startDir.y * startLock) * 0.28);

      return {
        from,
        control: { x: cx, y: cy },
        end: { x: to.x, y: to.y }
      };
    }

    function pointOnQuadratic(p0, p1, p2, t) {
      const oneMinusT = 1 - t;
      return {
        x: oneMinusT * oneMinusT * p0.x + 2 * oneMinusT * t * p1.x + t * t * p2.x,
        y: oneMinusT * oneMinusT * p0.y + 2 * oneMinusT * t * p1.y + t * t * p2.y
      };
    }

    function tangentOnQuadratic(p0, p1, p2, t) {
      return {
        x: 2 * (1 - t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x),
        y: 2 * (1 - t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y)
      };
    }

    function createArrowShapePath(fromTargetId, toTargetId) {
      const geometry = getArrowGeometry(fromTargetId, toTargetId);
      const p0 = geometry.from;
      const p1 = geometry.control;
      const p2 = geometry.end;
      const samples = 20;
      const left = [];
      const right = [];

      for (let i = 0; i <= samples; i += 1) {
        const t = i / samples;
        const point = pointOnQuadratic(p0, p1, p2, t);
        const tangent = tangentOnQuadratic(p0, p1, p2, t);
        const tangentLen = Math.hypot(tangent.x, tangent.y) || 1;
        const nx = -tangent.y / tangentLen;
        const ny = tangent.x / tangentLen;
        const currentWidth = arrowStartWidth + (arrowEndWidth - arrowStartWidth) * t;
        const halfWidth = currentWidth / 2;
        left.push({ x: point.x + nx * halfWidth, y: point.y + ny * halfWidth });
        right.push({ x: point.x - nx * halfWidth, y: point.y - ny * halfWidth });
      }

      let d = `M ${left[0].x} ${left[0].y}`;
      for (let i = 1; i < left.length; i += 1) {
        d += ` L ${left[i].x} ${left[i].y}`;
      }
      const endRadius = arrowEndWidth / 2;
      const endTangent = tangentOnQuadratic(p0, p1, p2, 1);
      const endTangentLen = Math.hypot(endTangent.x, endTangent.y) || 1;
      const tx = endTangent.x / endTangentLen;
      const ty = endTangent.y / endTangentLen;
      const rightEnd = right[right.length - 1];
      const outerEnd = { x: p2.x + tx * endRadius, y: p2.y + ty * endRadius };
      d += ` Q ${outerEnd.x} ${outerEnd.y} ${rightEnd.x} ${rightEnd.y}`;
      for (let i = right.length - 1; i >= 0; i -= 1) {
        d += ` L ${right[i].x} ${right[i].y}`;
      }
      d += " Z";
      return d;
    }

    function drawArrows() {
      arrowsLayer.replaceChildren();
      arrowDefs.replaceChildren();
      arrowHitLayer.replaceChildren();

      arrows.forEach((arrow) => {
        const geometry = getArrowGeometry(arrow.from, arrow.to);
        const gradient = document.createElementNS(svgNs, "linearGradient");
        const gradientId = `arrowGradient-${arrow.id}`;
        gradient.setAttribute("id", gradientId);
        gradient.setAttribute("gradientUnits", "userSpaceOnUse");
        gradient.setAttribute("x1", String(geometry.from.x));
        gradient.setAttribute("y1", String(geometry.from.y));
        gradient.setAttribute("x2", String(geometry.end.x));
        gradient.setAttribute("y2", String(geometry.end.y));
        const startStop = document.createElementNS(svgNs, "stop");
        startStop.setAttribute("offset", "0%");
        startStop.setAttribute("stop-color", "#f0f0ff");
        startStop.setAttribute("stop-opacity", "0.1");
        const endStop = document.createElementNS(svgNs, "stop");
        endStop.setAttribute("offset", "100%");
        endStop.setAttribute("stop-color", "#f0f0ff");
        endStop.setAttribute("stop-opacity", "0.4");
        gradient.appendChild(startStop);
        gradient.appendChild(endStop);
        arrowDefs.appendChild(gradient);

        const path = document.createElementNS(svgNs, "path");
        path.setAttribute("d", createArrowShapePath(arrow.from, arrow.to));
        path.setAttribute("fill", `url(#${gradientId})`);
        path.setAttribute("pointer-events", "none");
        arrowsLayer.appendChild(path);

        const hitPath = document.createElementNS(svgNs, "path");
        hitPath.setAttribute("d", createArrowShapePath(arrow.from, arrow.to));
        hitPath.setAttribute("fill", "none");
        hitPath.setAttribute("stroke", "transparent");
        hitPath.setAttribute("stroke-width", String(Math.max(16, cellWidth * 0.45)));
        hitPath.setAttribute("pointer-events", editMode === "delete" ? "stroke" : "none");
        hitPath.addEventListener("mousedown", (event) => {
          if (editMode !== "delete" || event.button !== 0) {
            return;
          }
          removeArrowById(arrow.id);
          event.preventDefault();
          event.stopPropagation();
        });
        arrowHitLayer.appendChild(hitPath);
      });
    }

    function drawLineStartMarker() {
      lineSelectionLayer.replaceChildren();
      if (editMode === "lines" && lineStartPointIndex !== null) {
        const anchor = getAnchorForArrow(lineStartPointIndex, false);
        const marker = document.createElementNS(svgNs, "circle");
        marker.setAttribute("cx", String(anchor.x));
        marker.setAttribute("cy", String(anchor.y));
        marker.setAttribute("r", "9");
        marker.setAttribute("fill", "rgba(255,255,255,0.85)");
        marker.setAttribute("stroke", "#506884");
        marker.setAttribute("stroke-width", "2");
        lineSelectionLayer.appendChild(marker);
      }
    }

    function recordEditAction(action) {
      editHistory.push(action);
      redoHistory.length = 0;
    }

    function getDiceFromInputs() {
      return {
        die1: String(dieOneInput.value),
        die2: String(dieTwoInput.value),
        cube: String(cubeValueInput.value)
      };
    }

    function syncDiceSnapshotFromInputs() {
      diceSnapshot = getDiceFromInputs();
    }

    function recordDiceCubeChangeIfNeeded() {
      const next = getDiceFromInputs();
      if (next.die1 === diceSnapshot.die1 && next.die2 === diceSnapshot.die2 && next.cube === diceSnapshot.cube) {
        return;
      }
      recordEditAction({
        type: "diceCube",
        prev: { ...diceSnapshot },
        next: { ...next }
      });
      renderBoard();
      syncDiceSnapshotFromInputs();
    }

    function queueTowerShiftAnimation(pointIndexLike, fromCount, toCount) {
      const pointIndex = Number(pointIndexLike);
      if (!Number.isInteger(pointIndex) || pointIndex < 0 || pointIndex >= pointDefs.length) {
        return;
      }
      if (fromCount === toCount) {
        return;
      }
      pendingTowerShiftAnimations.set(pointIndex, { fromCount, toCount });
    }

    function isBarPointId(pointId) {
      return pointId === "bar-top" || pointId === "bar-bottom";
    }

    function getPointStackById(pointId) {
      if (isBarPointId(pointId)) {
        return pointId === "bar-top" ? barStacks.top : barStacks.bottom;
      }
      const pointIndex = Number(pointId);
      if (!Number.isInteger(pointIndex) || pointIndex < 0 || pointIndex >= pointDefs.length) {
        return null;
      }
      return pointStacks[pointIndex];
    }

    function getTopCheckerColor(pointId) {
      const stack = getPointStackById(pointId);
      if (!stack || stack.length === 0) {
        return null;
      }
      return stack[stack.length - 1];
    }

    function popTopChecker(pointId) {
      const stack = getPointStackById(pointId);
      if (!stack || stack.length === 0) {
        return null;
      }
      return stack.pop();
    }

    function pushChecker(pointId, color) {
      const stack = getPointStackById(pointId);
      if (!stack) {
        return;
      }
      stack.push(color);
    }

    function getCheckerPlacementAnchor(pointId, colorForPlacement = "white") {
      if (isBarPointId(pointId)) {
        return {
          x: barX,
          y: pointId === "bar-top" ? barTopY : barBottomY
        };
      }
      const pointIndex = Number(pointId);
      const point = pointDefs[pointIndex];
      const stack = pointStacks[pointIndex];
      const nextCount = stack.length + 1;
      const step = nextCount <= 5 ? defaultStep : Math.min(defaultStep, maxTowerSpan / (nextCount - 1));
      return {
        x: point.x,
        y: point.startY + point.direction * (nextCount - 1) * step,
        color: colorForPlacement
      };
    }

    function animateCheckerMove(color, fromAnchor, toAnchor) {
      const style = checkerStyleForColor(color);
      const animatedChecker = document.createElementNS(svgNs, "circle");
      animatedChecker.setAttribute("r", String(radius));
      animatedChecker.setAttribute("fill", style.fill);
      animatedChecker.setAttribute("stroke", style.stroke);
      animatedChecker.setAttribute("stroke-width", "3");
      checkersLayer.appendChild(animatedChecker);

      return new Promise((resolve) => {
        const durationMs = 250;
        const startTs = performance.now();

        function tick(now) {
          const t = Math.min(1, (now - startTs) / durationMs);
          const eased = 1 - Math.pow(1 - t, 3);
          const x = fromAnchor.x + (toAnchor.x - fromAnchor.x) * eased;
          const y = fromAnchor.y + (toAnchor.y - fromAnchor.y) * eased;
          animatedChecker.setAttribute("cx", String(x));
          animatedChecker.setAttribute("cy", String(y));
          if (t < 1) {
            requestAnimationFrame(tick);
            return;
          }
          animatedChecker.remove();
          resolve();
        }

        requestAnimationFrame(tick);
      });
    }

    function addCheckerToBar(section, color) {
      if (section !== "top" && section !== "bottom") {
        return;
      }
      if (color !== "white" && color !== "black") {
        return;
      }
      barStacks[section].push(color);
      recordEditAction({ type: "addBar", section, color });
      renderBoard();
    }

    function removeCheckerFromBar(section) {
      if (section !== "top" && section !== "bottom") {
        return false;
      }
      const stack = barStacks[section];
      if (stack.length === 0) {
        return false;
      }
      const color = stack.pop();
      recordEditAction({ type: "deleteBar", section, color });
      renderBoard();
      return true;
    }

    function renderBoard() {
      checkersLayer.replaceChildren();
      countLabelsLayer.replaceChildren();
      extrasLayer.replaceChildren();

      pointStacks.forEach((stack, idx) => drawTower(idx, stack));
      pendingTowerShiftAnimations.clear();
      drawBarCheckers();
      drawArrows();
      drawLineStartMarker();

      const dieOne = clampInt(dieOneInput.value, 0, 6, 0);
      const dieTwo = clampInt(dieTwoInput.value, 0, 6, 0);
      dieOneInput.value = String(dieOne);
      dieTwoInput.value = String(dieTwo);
      if (dieOne > 0) {
        drawDie(689, 261, dieOne);
      }
      if (dieTwo > 0) {
        drawDie(745, 261, dieTwo);
      }

      const cubeValue = clampInt(cubeValueInput.value, 0, 64, 0);
      cubeValueInput.value = String(cubeValue);
      if (cubeValue > 0) {
        drawDoublingCube(cubeValue);
      }
    }

    function editPoint(pointIndex) {
      const stack = pointStacks[pointIndex];
      if (editMode === "white") {
        const prevCount = stack.length;
        stack.push("white");
        recordEditAction({ type: "add", pointIndex, color: "white" });
        queueTowerShiftAnimation(pointIndex, prevCount, stack.length);
      } else if (editMode === "black") {
        const prevCount = stack.length;
        stack.push("black");
        recordEditAction({ type: "add", pointIndex, color: "black" });
        queueTowerShiftAnimation(pointIndex, prevCount, stack.length);
      }
      renderBoard();
    }

    function deleteOneChecker(pointIndexLike) {
      const pointIndex = Number(pointIndexLike);
      if (!Number.isInteger(pointIndex) || pointIndex < 0 || pointIndex >= pointDefs.length) {
        return false;
      }
      const stack = pointStacks[pointIndex];
      if (stack.length === 0) {
        return false;
      }
      const prevCount = stack.length;
      const deletedColor = stack.pop();
      recordEditAction({ type: "delete", pointIndex, color: deletedColor });
      queueTowerShiftAnimation(pointIndex, prevCount, stack.length);
      renderBoard();
      return true;
    }

    function removeArrowById(arrowId) {
      const idx = arrows.findIndex((arrow) => arrow.id === arrowId);
      if (idx === -1) {
        return false;
      }
      const [removedArrow] = arrows.splice(idx, 1);
      recordEditAction({ type: "deleteArrow", arrow: removedArrow });
      if (lineStartPointIndex !== null && (lineStartPointIndex === removedArrow.from || lineStartPointIndex === removedArrow.to)) {
        lineStartPointIndex = null;
      }
      renderBoard();
      return true;
    }

    function removeLastArrowForPoint(pointId) {
      for (let i = arrows.length - 1; i >= 0; i -= 1) {
        const arrow = arrows[i];
        if (arrow.from !== pointId && arrow.to !== pointId) {
          continue;
        }
        return removeArrowById(arrow.id);
      }
      return false;
    }

    function deleteFromPoint(pointId) {
      if (pointId === "bar-top") {
        removeCheckerFromBar("top");
        return;
      }
      if (pointId === "bar-bottom") {
        removeCheckerFromBar("bottom");
        return;
      }
      if (deleteOneChecker(pointId)) {
        return;
      }
      removeLastArrowForPoint(pointId);
    }

    function handleLinePoint(pointId) {
      if (lineStartPointIndex === null) {
        lineStartPointIndex = pointId;
        renderBoard();
        return;
      }

      if (lineStartPointIndex === pointId) {
        lineStartPointIndex = null;
        renderBoard();
        return;
      }

      const arrow = {
        id: nextArrowId,
        from: lineStartPointIndex,
        to: pointId
      };
      nextArrowId += 1;
      arrows.push(arrow);
      recordEditAction({ type: "addArrow", arrow });
      lineStartPointIndex = null;
      renderBoard();
    }

    async function handleMovePoint(pointId) {
      if (isMoveAnimating) {
        return;
      }

      if (moveStartPointId === null) {
        if (!getTopCheckerColor(pointId)) {
          return;
        }
        moveStartPointId = pointId;
        renderBoard();
        return;
      }

      if (moveStartPointId === pointId) {
        moveStartPointId = null;
        renderBoard();
        return;
      }

      const fromPointId = moveStartPointId;
      const color = getTopCheckerColor(fromPointId);
      if (!color) {
        moveStartPointId = null;
        renderBoard();
        return;
      }

      const fromAnchor = getAnchorForArrow(fromPointId, false);
      const fromStack = getPointStackById(fromPointId);
      const toStack = getPointStackById(pointId);
      const fromPrevCount = fromStack ? fromStack.length : 0;
      const toPrevCount = toStack ? toStack.length : 0;
      const movedColor = popTopChecker(fromPointId);
      const toAnchor = getCheckerPlacementAnchor(pointId, movedColor || color);
      isMoveAnimating = true;
      moveStartPointId = null;
      pushChecker(pointId, movedColor || color);
      moveInFlight = { toPointId: pointId, color: movedColor || color };
      queueTowerShiftAnimation(pointId, toPrevCount, toPrevCount + 1);
      queueTowerShiftAnimation(fromPointId, fromPrevCount, Math.max(0, fromPrevCount - 1));
      renderBoard();
      await animateCheckerMove(movedColor || color, fromAnchor, toAnchor);
      moveInFlight = null;
      recordEditAction({ type: "moveChecker", from: fromPointId, to: pointId, color: movedColor || color });
      isMoveAnimating = false;
      renderBoard();
    }

    function undoLastEdit() {
      if (lineStartPointIndex !== null) {
        redoHistory.push({ type: "lineStartSelection", pointIndex: lineStartPointIndex });
        lineStartPointIndex = null;
        renderBoard();
        return;
      }

      const lastAction = editHistory.pop();
      if (!lastAction) {
        return;
      }

      if (lastAction.type === "diceCube") {
        dieOneInput.value = lastAction.prev.die1;
        dieTwoInput.value = lastAction.prev.die2;
        cubeValueInput.value = lastAction.prev.cube;
        redoHistory.push(lastAction);
        renderBoard();
        syncDiceSnapshotFromInputs();
        return;
      }

      if (lastAction.type === "addBar") {
        const stack = barStacks[lastAction.section];
        if (stack.length > 0) {
          stack.pop();
        }
        redoHistory.push(lastAction);
        renderBoard();
        return;
      }
      if (lastAction.type === "deleteBar") {
        barStacks[lastAction.section].push(lastAction.color);
        redoHistory.push(lastAction);
        renderBoard();
        return;
      }
      if (lastAction.type === "moveChecker") {
        const fromStack = getPointStackById(lastAction.from);
        const toStack = getPointStackById(lastAction.to);
        const fromPrevCount = fromStack ? fromStack.length : 0;
        const toPrevCount = toStack ? toStack.length : 0;
        const moved = popTopChecker(lastAction.to);
        if (moved) {
          pushChecker(lastAction.from, moved);
        }
        queueTowerShiftAnimation(lastAction.to, toPrevCount, Math.max(0, toPrevCount - 1));
        queueTowerShiftAnimation(lastAction.from, fromPrevCount, fromPrevCount + 1);
        moveStartPointId = null;
        redoHistory.push(lastAction);
        renderBoard();
        return;
      }

      const stack = pointStacks[lastAction.pointIndex];
      if (lastAction.type === "add") {
        const prevCount = stack.length;
        if (stack.length > 0) {
          stack.pop();
        }
        queueTowerShiftAnimation(lastAction.pointIndex, prevCount, stack.length);
      } else if (lastAction.type === "delete") {
        const prevCount = stack.length;
        stack.push(lastAction.color);
        queueTowerShiftAnimation(lastAction.pointIndex, prevCount, stack.length);
      } else if (lastAction.type === "addArrow") {
        const idx = arrows.findIndex((arrow) => arrow.id === lastAction.arrow.id);
        if (idx !== -1) {
          arrows.splice(idx, 1);
        }
      } else if (lastAction.type === "deleteArrow") {
        arrows.push(lastAction.arrow);
      }
      redoHistory.push(lastAction);
      renderBoard();
    }

    function redoLastEdit() {
      const redoAction = redoHistory.pop();
      if (!redoAction) {
        return;
      }

      if (redoAction.type === "lineStartSelection") {
        lineStartPointIndex = redoAction.pointIndex;
        renderBoard();
        return;
      }

      if (redoAction.type === "diceCube") {
        dieOneInput.value = redoAction.next.die1;
        dieTwoInput.value = redoAction.next.die2;
        cubeValueInput.value = redoAction.next.cube;
        editHistory.push(redoAction);
        renderBoard();
        syncDiceSnapshotFromInputs();
        return;
      }

      if (redoAction.type === "addBar") {
        barStacks[redoAction.section].push(redoAction.color);
        editHistory.push(redoAction);
        renderBoard();
        return;
      }
      if (redoAction.type === "deleteBar") {
        const stack = barStacks[redoAction.section];
        if (stack.length > 0) {
          stack.pop();
        }
        editHistory.push(redoAction);
        renderBoard();
        return;
      }
      if (redoAction.type === "moveChecker") {
        const fromStack = getPointStackById(redoAction.from);
        const toStack = getPointStackById(redoAction.to);
        const fromPrevCount = fromStack ? fromStack.length : 0;
        const toPrevCount = toStack ? toStack.length : 0;
        const moved = popTopChecker(redoAction.from);
        if (moved) {
          pushChecker(redoAction.to, moved);
        }
        queueTowerShiftAnimation(redoAction.from, fromPrevCount, Math.max(0, fromPrevCount - 1));
        queueTowerShiftAnimation(redoAction.to, toPrevCount, toPrevCount + 1);
        moveStartPointId = null;
        editHistory.push(redoAction);
        renderBoard();
        return;
      }

      const stack = pointStacks[redoAction.pointIndex];
      if (redoAction.type === "add") {
        const prevCount = stack.length;
        stack.push(redoAction.color);
        queueTowerShiftAnimation(redoAction.pointIndex, prevCount, stack.length);
      } else if (redoAction.type === "delete") {
        const prevCount = stack.length;
        if (stack.length > 0) {
          stack.pop();
        }
        queueTowerShiftAnimation(redoAction.pointIndex, prevCount, stack.length);
      } else if (redoAction.type === "addArrow") {
        arrows.push(redoAction.arrow);
      } else if (redoAction.type === "deleteArrow") {
        const idx = arrows.findIndex((arrow) => arrow.id === redoAction.arrow.id);
        if (idx !== -1) {
          arrows.splice(idx, 1);
        }
      }
      editHistory.push(redoAction);
      renderBoard();
    }

    function clearBoardState() {
      pointStacks.forEach((stack) => {
        stack.length = 0;
      });
      barStacks.top.length = 0;
      barStacks.bottom.length = 0;
      arrows.length = 0;
      lineStartPointIndex = null;
      moveStartPointId = null;
      moveInFlight = null;
      editHistory.length = 0;
      redoHistory.length = 0;
      isDeleteDragging = false;
      stopDeleteHold();
      dieOneInput.value = "0";
      dieTwoInput.value = "0";
      cubeValueInput.value = "0";
      diceSnapshot = { die1: "0", die2: "0", cube: "0" };
      renderBoard();
    }

    function setPointStackByNumber(pointNumber, color, count) {
      const index = pointNumber - 1;
      if (index < 0 || index >= pointStacks.length) {
        return;
      }
      const stack = pointStacks[index];
      stack.length = 0;
      for (let i = 0; i < count; i += 1) {
        stack.push(color);
      }
    }

    function applyLongNardySetup() {
      clearBoardState();
      setPointStackByNumber(1, "white", 15);
      setPointStackByNumber(13, "black", 15);
      renderBoard();
    }

    function applyShortNardySetup() {
      clearBoardState();
      setPointStackByNumber(1, "white", 2);
      setPointStackByNumber(12, "white", 5);
      setPointStackByNumber(17, "white", 3);
      setPointStackByNumber(19, "white", 5);

      setPointStackByNumber(24, "black", 2);
      setPointStackByNumber(13, "black", 5);
      setPointStackByNumber(8, "black", 3);
      setPointStackByNumber(6, "black", 5);
      renderBoard();
    }

    function stopDeleteHold() {
      if (deleteHoldTimer !== null) {
        window.clearInterval(deleteHoldTimer);
        deleteHoldTimer = null;
      }
      activeDeletePointIndex = null;
    }

    function startDeleteHold(pointIndex) {
      activeDeletePointIndex = pointIndex;
      if (deleteHoldTimer !== null) {
        return;
      }
      deleteHoldTimer = window.setInterval(() => {
        if (!isDeleteDragging || activeDeletePointIndex === null) {
          return;
        }
        deleteFromPoint(activeDeletePointIndex);
      }, 120);
    }

    function createHitZones() {
      hitZonesLayer.replaceChildren();
      const rectWidth = 47.167;
      const rectHeight = 513 / 2;
      const hitZoneCornerRadius = 6;
      const zoneLeftOffset = rectWidth / 2;
      const topZoneY = 22;
      const bottomZoneY = 535 - rectHeight;

      pointDefs.forEach((point, pointIndex) => {
        const rect = document.createElementNS(svgNs, "rect");
        rect.setAttribute("x", String(point.x - zoneLeftOffset));
        rect.setAttribute("y", String(point.direction === 1 ? topZoneY : bottomZoneY));
        rect.setAttribute("width", String(rectWidth));
        rect.setAttribute("height", String(rectHeight));
        rect.setAttribute("rx", String(hitZoneCornerRadius));
        rect.setAttribute("ry", String(hitZoneCornerRadius));
        rect.setAttribute("class", "hover-zone");
        const pointId = String(pointIndex);
        rect.dataset.pointIndex = pointId;
        rect.addEventListener("mousedown", (event) => {
          if (editMode !== "delete" || event.button !== 0) {
            return;
          }
          deleteFromPoint(pointId);
          isDeleteDragging = true;
          startDeleteHold(pointId);
          event.preventDefault();
        });
        rect.addEventListener("mouseenter", (event) => {
          if (editMode !== "delete" || !isDeleteDragging || (event.buttons & 1) !== 1) {
            return;
          }
          activeDeletePointIndex = pointId;
          deleteFromPoint(pointId);
        });
        rect.addEventListener("mouseleave", () => {
          if (editMode !== "delete") {
            return;
          }
          if (activeDeletePointIndex === pointId) {
            activeDeletePointIndex = null;
          }
        });
        rect.addEventListener("click", () => {
          if (editMode === "lines") {
            handleLinePoint(pointId);
            return;
          }
          if (editMode === "move") {
            void handleMovePoint(pointId);
            return;
          }
          if (editMode !== "delete") {
            editPoint(pointIndex);
          }
        });
        hitZonesLayer.appendChild(rect);
      });

      const barTopRect = document.createElementNS(svgNs, "rect");
      barTopRect.setAttribute("x", String(barX - zoneLeftOffset));
      barTopRect.setAttribute("y", String(topZoneY));
      barTopRect.setAttribute("width", String(rectWidth));
      barTopRect.setAttribute("height", String(rectHeight));
      barTopRect.setAttribute("rx", String(hitZoneCornerRadius));
      barTopRect.setAttribute("ry", String(hitZoneCornerRadius));
      barTopRect.setAttribute("class", "hover-zone");
      barTopRect.dataset.pointIndex = "bar-top";
      barTopRect.addEventListener("mousedown", (event) => {
        if (event.button !== 0) {
          return;
        }
        if (editMode === "delete") {
          removeCheckerFromBar("top");
          event.preventDefault();
        }
      });
      barTopRect.addEventListener("click", () => {
        if (editMode === "lines") {
          handleLinePoint("bar-top");
        } else if (editMode === "move") {
          void handleMovePoint("bar-top");
        } else if (editMode === "white") {
          addCheckerToBar("top", "white");
        } else if (editMode === "black") {
          addCheckerToBar("top", "black");
        }
      });
      hitZonesLayer.appendChild(barTopRect);

      const barBottomRect = document.createElementNS(svgNs, "rect");
      barBottomRect.setAttribute("x", String(barX - zoneLeftOffset));
      barBottomRect.setAttribute("y", String(bottomZoneY));
      barBottomRect.setAttribute("width", String(rectWidth));
      barBottomRect.setAttribute("height", String(rectHeight));
      barBottomRect.setAttribute("rx", String(hitZoneCornerRadius));
      barBottomRect.setAttribute("ry", String(hitZoneCornerRadius));
      barBottomRect.setAttribute("class", "hover-zone");
      barBottomRect.dataset.pointIndex = "bar-bottom";
      barBottomRect.addEventListener("mousedown", (event) => {
        if (event.button !== 0) {
          return;
        }
        if (editMode === "delete") {
          removeCheckerFromBar("bottom");
          event.preventDefault();
        }
      });
      barBottomRect.addEventListener("click", () => {
        if (editMode === "lines") {
          handleLinePoint("bar-bottom");
        } else if (editMode === "move") {
          void handleMovePoint("bar-bottom");
        } else if (editMode === "white") {
          addCheckerToBar("bottom", "white");
        } else if (editMode === "black") {
          addCheckerToBar("bottom", "black");
        }
      });
      hitZonesLayer.appendChild(barBottomRect);
    }

    function setBoardScale(scaleValue) {
      const safeValue = Math.max(20, Math.min(getMaxScreenScale(), scaleValue));
      const width = (baseBoardWidth * safeValue) / 100;
      boardSvg.style.width = `${width}px`;
      currentBoardScale = safeValue;
    }

    function getAvailableBoardWidth() {
      const isMobile = window.matchMedia("(max-width: 768px)").matches;
      if (isMobile) {
        return Math.max(1, window.innerWidth);
      }
      const bodyHorizontalPadding = 32;
      return Math.max(1, window.innerWidth - bodyHorizontalPadding);
    }

    function getMaxScreenScale() {
      const availableWidth = getAvailableBoardWidth();
      const fitScale = Math.floor((availableWidth / baseBoardWidth) * 100);
      return Math.max(20, fitScale);
    }

    function getInitialBoardScale() {
      const isMobile = window.matchMedia("(max-width: 768px)").matches;
      if (!isMobile) {
        return 60;
      }
      return getMaxScreenScale();
    }

    function applyBoardFlip() {
      if (isBoardFlipped) {
        const bbox = boardContent.getBBox();
        const cx = bbox.x + bbox.width / 2;
        const cy = bbox.y + bbox.height / 2;
        boardContent.setAttribute("transform", `rotate(180 ${cx} ${cy})`);
      } else {
        boardContent.removeAttribute("transform");
      }

      pointLabelsLayer.querySelectorAll("text").forEach((textNode) => {
        applyTextFlipCompensation(textNode);
      });
      checkersLayer.querySelectorAll("text").forEach((textNode) => {
        applyTextFlipCompensation(textNode);
      });
      countLabelsLayer.querySelectorAll("text").forEach((textNode) => {
        applyTextFlipCompensation(textNode);
      });
      extrasLayer.querySelectorAll("text").forEach((textNode) => {
        applyTextFlipCompensation(textNode);
      });
    }

    function prepareBoardSvgForExport() {
      const clone = boardSvg.cloneNode(true);
      clone.removeAttribute("style");
      clone.getElementById("hitZonesLayer")?.remove();
      clone.getElementById("arrowHitLayer")?.remove();
      clone.getElementById("moveAnimationLayer")?.replaceChildren();
      clone.getElementById("lineSelectionLayer")?.replaceChildren();
      clone.querySelectorAll("animate, animateTransform").forEach((el) => {
        el.remove();
      });
      clone.querySelectorAll("#checkersLayer circle[style]").forEach((el) => {
        el.removeAttribute("style");
      });
      const styleEl = document.createElementNS(svgNs, "style");
      styleEl.textContent = "\n        .point-label { font-variant-numeric: tabular-nums; }\n        ";
      clone.insertBefore(styleEl, clone.firstChild);
      clone.setAttribute("width", "808");
      clone.setAttribute("height", "558");
      if (!clone.getAttribute("xmlns")) {
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      }
      return clone;
    }

    function svgToPngBlob() {
      return new Promise((resolve, reject) => {
        const clone = prepareBoardSvgForExport();
        const serializer = new XMLSerializer();
        const svgString = serializer.serializeToString(clone);
        const dataUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgString)}`;
        const image = new Image();
        let objectUrl = null;

        const drawToPng = () => {
          const canvas = document.createElement("canvas");
          canvas.width = 808;
          canvas.height = 558;
          const ctx = canvas.getContext("2d");
          try {
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          } catch (err) {
            if (objectUrl) {
              URL.revokeObjectURL(objectUrl);
            }
            reject(err);
            return;
          }
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrl = null;
          }
          canvas.toBlob(
            (blob) => {
              if (!blob) {
                reject(new Error("Не удалось создать PNG"));
                return;
              }
              resolve(blob);
            },
            "image/png"
          );
        };

        const runDecodeAndDraw = async () => {
          try {
            if (image.decode) {
              await image.decode();
            }
          } catch {
            // ignore; still try to draw
          }
          requestAnimationFrame(drawToPng);
        };

        image.onload = () => {
          void runDecodeAndDraw();
        };

        image.onerror = () => {
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrl = null;
            reject(new Error("Ошибка рендера SVG"));
            return;
          }
          objectUrl = URL.createObjectURL(
            new Blob([svgString], { type: "image/svg+xml;charset=utf-8" })
          );
          image.src = objectUrl;
        };

        image.src = dataUrl;
      });
    }

    async function savePng() {
      try {
        const pngBlob = await svgToPngBlob();
        if ("showSaveFilePicker" in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: "board-position.png",
            types: [{ description: "PNG image", accept: { "image/png": [".png"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(pngBlob);
          await writable.close();
          return;
        }

        // Mobile-friendly path: share image file if supported.
        if ("canShare" in navigator && "share" in navigator) {
          const pngFile = new File([pngBlob], "board-position.png", { type: "image/png" });
          if (navigator.canShare({ files: [pngFile] })) {
            await navigator.share({
              title: "Board position",
              files: [pngFile]
            });
            return;
          }
        }

        const url = URL.createObjectURL(pngBlob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "board-position.png";
        link.click();

        // iOS/Safari can ignore download attribute: open image directly.
        window.setTimeout(() => {
          window.open(url, "_blank");
        }, 50);

        URL.revokeObjectURL(url);
      } catch (error) {
        console.error(error);
        alert("Не удалось экспортировать PNG");
      }
    }

    zoomOutBtn.addEventListener("click", () => {
      setBoardScale(currentBoardScale - 10);
    });
    zoomInBtn.addEventListener("click", () => {
      setBoardScale(currentBoardScale + 10);
    });
    togglePointLabelsBtn.addEventListener("click", () => {
      arePointLabelsVisible = !arePointLabelsVisible;
      syncPointLabelsVisibility();
    });
    dieOneInput.addEventListener("change", () => {
      recordDiceCubeChangeIfNeeded();
    });
    dieTwoInput.addEventListener("change", () => {
      recordDiceCubeChangeIfNeeded();
    });
    rollDiceBtn.addEventListener("click", () => {
      const next = {
        die1: String(clampInt(Math.floor(Math.random() * 6) + 1, 1, 6, 1)),
        die2: String(clampInt(Math.floor(Math.random() * 6) + 1, 1, 6, 1)),
        cube: String(cubeValueInput.value)
      };
      recordEditAction({
        type: "diceCube",
        prev: { ...diceSnapshot },
        next
      });
      dieOneInput.value = next.die1;
      dieTwoInput.value = next.die2;
      renderBoard();
      syncDiceSnapshotFromInputs();
    });
    cubeValueInput.addEventListener("change", () => {
      recordDiceCubeChangeIfNeeded();
    });
    exportPngBtn.addEventListener("click", savePng);
    paletteMenuBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      setPaletteMenuOpen(paletteMenuDropdown.hidden);
    });
    document.addEventListener("mousedown", (event) => {
      if (!paletteMenuDropdown || paletteMenuDropdown.hidden) {
        return;
      }
      const t = event.target;
      if (!(t instanceof Node)) {
        return;
      }
      if (paletteMenuBtn && paletteMenuBtn.parentElement.contains(t)) {
        return;
      }
      setPaletteMenuOpen(false);
    });
    flipBoardBtn.addEventListener("click", () => {
      isBoardFlipped = !isBoardFlipped;
      applyBoardFlip();
    });
    backBtn.addEventListener("click", undoLastEdit);
    clearBtn.addEventListener("click", clearBoardState);
    setupLongBtn.addEventListener("click", applyLongNardySetup);
    setupShortBtn.addEventListener("click", applyShortNardySetup);

    Object.entries(modeButtons).forEach(([mode, btn]) => {
      btn.addEventListener("click", () => {
        applyMode(mode);
        if (mode !== "delete") {
          stopDeleteHold();
          isDeleteDragging = false;
        }
      });
    });
    window.addEventListener("mouseup", () => {
      isDeleteDragging = false;
      stopDeleteHold();
    });
    window.addEventListener("resize", () => {
      setBoardScale(currentBoardScale);
    });
    window.addEventListener("mousedown", (event) => {
      const target = event.target;
      const clickedOnHitRect = target instanceof Element && target.closest(".hover-zone");
      if (clickedOnHitRect) {
        return;
      }
      if (lineStartPointIndex === null && moveStartPointId === null) {
        return;
      }
      lineStartPointIndex = null;
      moveStartPointId = null;
      renderBoard();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && paletteMenuDropdown && !paletteMenuDropdown.hidden) {
        event.preventDefault();
        setPaletteMenuOpen(false);
        paletteMenuBtn.focus();
        return;
      }
      const key = event.key.toLowerCase();
      const isUndoKey = (event.ctrlKey || event.metaKey) && !event.shiftKey && (key === "z" || key === "я");
      const isRedoKey = (event.ctrlKey || event.metaKey) && event.shiftKey && (key === "z" || key === "я");
      if (!isUndoKey && !isRedoKey) {
        return;
      }

      const target = event.target;
      const isTypingTarget = target instanceof HTMLElement && (
        target.tagName === "INPUT" ||
        target.tagName === "TEXTAREA" ||
        target.tagName === "SELECT" ||
        target.isContentEditable
      );
      if (isTypingTarget) {
        return;
      }

      event.preventDefault();
      if (isRedoKey) {
        redoLastEdit();
        return;
      }
      undoLastEdit();
    });

    initBoardPaletteFromStorage();
    createPointLabels();
    createHitZones();
    syncPointLabelsVisibility();
    setBoardScale(getInitialBoardScale());
    applyMode("move");
    applyBoardFlip();
    renderBoard();
    syncDiceSnapshotFromInputs();
  </script>
</body>
</html>
