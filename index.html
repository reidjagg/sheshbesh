    function svgToPngBlob() {
      return new Promise((resolve, reject) => {
        const clone = prepareBoardSvgForExport();
        const serializer = new XMLSerializer();
        const svgString = serializer.serializeToString(clone);
        const dataUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgString)}`;
        const image = new Image();
        let objectUrl = null;

        const drawToPng = () => {
          const canvas = document.createElement("canvas");
          canvas.width = 808;
          canvas.height = 669;
          const ctx = canvas.getContext("2d");
          try {
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          } catch (err) {
            if (objectUrl) {
              URL.revokeObjectURL(objectUrl);
            }
            reject(err);
            return;
          }
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrl = null;
          }
          canvas.toBlob(
            (blob) => {
              if (!blob) {
                reject(new Error("Не удалось создать PNG"));
                return;
              }
              resolve(blob);
            },
            "image/png"
          );
        };

        const runDecodeAndDraw = async () => {
          try {
            if (image.decode) {
              await image.decode();
            }
          } catch {
            // ignore; still try to draw
          }
          requestAnimationFrame(drawToPng);
        };

        image.onload = () => {
          void runDecodeAndDraw();
        };

        image.onerror = () => {
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
            objectUrl = null;
            reject(new Error("Ошибка рендера SVG"));
            return;
          }
          objectUrl = URL.createObjectURL(
            new Blob([svgString], { type: "image/svg+xml;charset=utf-8" })
          );
          image.src = objectUrl;
        };

        image.src = dataUrl;
      });
    }

    async function savePng() {
      try {
        const pngBlob = await svgToPngBlob();
        if ("showSaveFilePicker" in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: "board-position.png",
            types: [{ description: "PNG image", accept: { "image/png": [".png"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(pngBlob);
          await writable.close();
          return;
        }

        // Mobile-friendly path: share image file if supported.
        if ("canShare" in navigator && "share" in navigator) {
          const pngFile = new File([pngBlob], "board-position.png", { type: "image/png" });
          if (navigator.canShare({ files: [pngFile] })) {
            await navigator.share({
              title: "Board position",
              files: [pngFile]
            });
            return;
          }
        }

        const url = URL.createObjectURL(pngBlob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "board-position.png";
        link.click();

        // iOS/Safari can ignore download attribute: open image directly.
        window.setTimeout(() => {
          window.open(url, "_blank");
        }, 50);

        URL.revokeObjectURL(url);
      } catch (error) {
        console.error(error);
        alert("Не удалось экспортировать PNG");
      }
    }

    function isSoundDescriptor(sound) {
      return Boolean(
        sound &&
        typeof sound === "object" &&
        typeof sound.src === "string" &&
        Array.isArray(sound.pool)
      );
    }

    function queuePendingSound(sound) {
      if (!isSoundDescriptor(sound)) {
        return;
      }
      if (pendingSoundQueue[pendingSoundQueue.length - 1] !== sound) {
        pendingSoundQueue.push(sound);
      }
      if (pendingSoundQueue.length > 6) {
        pendingSoundQueue.shift();
      }
    }

    function pickSoundChannel(sound) {
      if (!isSoundDescriptor(sound) || sound.pool.length === 0) {
        return null;
      }
      const idx = sound.cursor % sound.pool.length;
      sound.cursor = (sound.cursor + 1) % sound.pool.length;
      return sound.pool[idx];
    }

    function ensureAudioContext() {
      if (audioContext) {
        return audioContext;
      }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (typeof Ctx !== "function") {
        return null;
      }
      try {
        audioContext = new Ctx();
        masterGainNode = audioContext.createGain();
        masterGainNode.gain.value = 0.9;
        masterGainNode.connect(audioContext.destination);
      } catch (_) {
        audioContext = null;
        masterGainNode = null;
      }
      return audioContext;
    }

    async function ensureAudioContextReady() {
      const ctx = ensureAudioContext();
      if (!ctx) {
        return false;
      }
      if (ctx.state === "suspended") {
        try {
          await ctx.resume();
        } catch (_) {
          return false;
        }
      }
      return ctx.state === "running";
    }

    async function loadSoundBuffer(sound) {
      if (!isSoundDescriptor(sound)) {
        return null;
      }
      if (sound.buffer) {
        return sound.buffer;
      }
      if (sound.loadingPromise) {
        return sound.loadingPromise;
      }
      const ctx = ensureAudioContext();
      if (!ctx) {
        return null;
      }
      sound.loadingPromise = fetch(sound.src)
        .then((resp) => {
          if (!resp.ok) {
            throw new Error(`Failed to load sound: ${sound.src}`);
          }
          return resp.arrayBuffer();
        })
        .then((data) => ctx.decodeAudioData(data))
        .then((buffer) => {
          sound.buffer = buffer;
          return buffer;
        })
        .catch(() => null)
        .finally(() => {
          sound.loadingPromise = null;
        });
      return sound.loadingPromise;
    }

    function preloadAllSoundBuffers() {
      if (!audioContext) {
        return;
      }
      void loadSoundBuffer(soundRoll);
      void loadSoundBuffer(soundCheck);
      void loadSoundBuffer(soundMove);
    }

    function playSoundViaHtmlAudio(sound) {
      const audio = pickSoundChannel(sound);
      if (!(audio instanceof HTMLAudioElement)) {
        return;
      }
      try {
        audio.currentTime = 0;
      } catch (_) {
        /* ignore */
      }
      const playPromise = audio.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch((error) => {
          if (error && error.name === "NotAllowedError") {
            isAudioUnlocked = false;
            queuePendingSound(sound);
          }
        });
      }
    }

    function playSoundNow(sound) {
      if (!isSoundDescriptor(sound)) {
        return;
      }
      if (audioContext && masterGainNode && sound.buffer) {
        try {
          const srcNode = audioContext.createBufferSource();
          srcNode.buffer = sound.buffer;
          srcNode.connect(masterGainNode);
          srcNode.start(0);
          return;
        } catch (_) {
          /* fallback to html audio below */
        }
      }
      playSoundViaHtmlAudio(sound);
    }

    function flushPendingSounds() {
      if (!isAudioUnlocked || !isSoundEnabled || pendingSoundQueue.length === 0) {
        return;
      }
      const queued = pendingSoundQueue.splice(0, pendingSoundQueue.length);
      queued.forEach((sound) => {
        playSoundNow(sound);
      });
    }

    function playSound(sound) {
      if (!isSoundEnabled) {
        return;
      }
      if (!isSoundDescriptor(sound)) {
        return;
      }
      if (!isAudioUnlocked) {
        queuePendingSound(sound);
        return;
      }
      playSoundNow(sound);
    }

    function unlockAudioOnUserGesture() {
      if (isAudioUnlocked) {
        flushPendingSounds();
        return;
      }
      if (isAudioUnlockInProgress) {
        return;
      }
      const src = soundMove?.src || soundCheck?.src || soundRoll?.src;
      if (!src) {
        return;
      }
      isAudioUnlockInProgress = true;
      ensureAudioContextReady()
        .then((ready) => {
          if (ready) {
            isAudioUnlocked = true;
            preloadAllSoundBuffers();
            return;
          }
          const probe = pickSoundChannel(soundMove) || new Audio(src);
          probe.muted = true;
          probe.preload = "auto";
          const p = probe.play();
          if (!p || typeof p.then !== "function") {
            isAudioUnlocked = true;
            probe.muted = false;
            return;
          }
          return p.then(() => {
            probe.pause();
            try {
              probe.currentTime = 0;
            } catch (_) {
              /* ignore */
            }
            isAudioUnlocked = true;
            probe.muted = false;
          }).catch(() => {
            isAudioUnlocked = false;
            probe.muted = false;
          });
        })
        .catch(() => {
          isAudioUnlocked = false;
        })
        .finally(() => {
          isAudioUnlockInProgress = false;
          if (isAudioUnlocked) {
            flushPendingSounds();
          }
        });
    }

    function rollDiceRandomly() {
      const next = {
        die1: String(clampInt(Math.floor(Math.random() * 6) + 1, 1, 6, 1)),
        die2: String(clampInt(Math.floor(Math.random() * 6) + 1, 1, 6, 1)),

      };

      });
      if (diceRollRevealTimerId !== null) {

        diceRollRevealTimerId = null;
      }
      playSound(soundRoll);
      isDiceRollTransition = true;
      shouldAnimateDice = false;
      renderBoard();
      diceRollRevealTimerId = window.setTimeout(() => {
        dieOneInput.value = next.die1;
        dieTwoInput.value = next.die2;
        isDiceRollTransition = false;
        shouldAnimateDice = true;

        diceRollRevealTimerId = null;
      }, 70);
    }

    function handleDeviceMotionForDiceRoll(event) {
      const acceleration = event.accelerationIncludingGravity || event.acceleration;
      if (!acceleration) {
        return;
      }
      const ax = Number(acceleration.x) || 0;
      const ay = Number(acceleration.y) || 0;
      const az = Number(acceleration.z) || 0;
      const magnitude = Math.hypot(ax, ay, az);
      if (lastShakeMagnitude === null) {
        lastShakeMagnitude = magnitude;
        return;
      }

      const delta = Math.abs(magnitude - lastShakeMagnitude);
      lastShakeMagnitude = magnitude;

      // Max sensitivity: trigger even on light hand movement.
      const shakeThreshold = 3;
      const shakeCooldownMs = 700;
      const now = Date.now();
      if (delta < shakeThreshold || (now - lastShakeRollAt) < shakeCooldownMs) {
        return;
      }
      lastShakeRollAt = now;
      rollDiceRandomly();
    }

    function startShakeDiceRollListening() {
      if (isShakeMotionListening || typeof window === "undefined" || typeof DeviceMotionEvent === "undefined") {
        return;
      }
      window.addEventListener("devicemotion", handleDeviceMotionForDiceRoll, { passive: true });
      isShakeMotionListening = true;
      lastShakeMagnitude = null;
      if (enableShakeBtn) {
        enableShakeBtn.classList.add("active");
      }
    }

    function stopShakeDiceRollListening() {
      if (!isShakeMotionListening || typeof window === "undefined") {
        return;
      }
      window.removeEventListener("devicemotion", handleDeviceMotionForDiceRoll);
      isShakeMotionListening = false;
      lastShakeMagnitude = null;
      if (enableShakeBtn) {
        enableShakeBtn.classList.remove("active");
      }
    }

    async function requestShakePermissionAndEnable() {
      if (typeof window === "undefined" || typeof DeviceMotionEvent === "undefined") {
        motionPermissionState = "denied";
        if (enableShakeBtn) {
          enableShakeBtn.classList.remove("active");
        }
        return;
      }
      if (typeof DeviceMotionEvent.requestPermission === "function") {
        try {
          const state = await DeviceMotionEvent.requestPermission();
          if (state === "granted") {
            motionPermissionState = "granted";
            startShakeDiceRollListening();
            return;
          }
          motionPermissionState = "denied";
        } catch (error) {
          motionPermissionState = "unknown";
        }
      } else {
        motionPermissionState = "granted";
        startShakeDiceRollListening();
        return;
      }
      if (enableShakeBtn) {
        enableShakeBtn.classList.remove("active");
      }
    }

    zoomOutBtn.addEventListener("click", () => {
      setBoardScale(currentBoardScale - 10);
    });
    zoomInBtn.addEventListener("click", () => {
      setBoardScale(currentBoardScale + 10);
    });
    if (fieldHeightSlider) {
      const { minOffset, maxOffset } = getFieldHeightOffsetBounds();
      fieldHeightSlider.min = String(minOffset);
      fieldHeightSlider.max = String(maxOffset);
      fieldHeightSlider.value = String(boardFieldHeightOffset);
      fieldHeightSlider.addEventListener("input", () => {
        applyBoardFieldHeight(fieldHeightSlider.value);
      });
    }
    if (diceSizeSlider) {
      diceSizeSlider.addEventListener("input", () => {
        const nextSize = clampInt(diceSizeSlider.value, minDiceSize, maxDiceSize, defaultDiceSize);
        currentDiceSize = nextSize;
        diceSizeSlider.value = String(nextSize);
        syncDiceSizeValue();
        const { minOffset, maxOffset } = getFieldHeightOffsetBounds();
        if (fieldHeightSlider) {
          fieldHeightSlider.min = String(minOffset);
          fieldHeightSlider.max = String(maxOffset);
        }
        if (boardFieldHeightOffset > maxOffset) {
          applyBoardFieldHeight(maxOffset);
          return;
        }
        if (boardFieldHeightOffset < minOffset) {
          applyBoardFieldHeight(minOffset);
          return;
        }
        renderBoard();
      });
    }
    dieOneInput.addEventListener("change", () => {
      playSound(soundRoll);
      recordDiceChangeIfNeeded();
    });
    dieTwoInput.addEventListener("change", () => {
      playSound(soundRoll);
      recordDiceChangeIfNeeded();
    });
    if (clearDiceValuesBtn) {
      clearDiceValuesBtn.addEventListener("click", () => {
        const prev = getDiceFromInputs();
        const next = { die1: "0", die2: "0", cube: "0" };
        if (prev.die1 === next.die1 && prev.die2 === next.die2 && prev.cube === next.cube) {
          return;
        }
        dieOneInput.value = next.die1;
        dieTwoInput.value = next.die2;
        cubeValueInput.value = next.cube;
        recordEditAction({
          type: "diceCube",
          prev: { ...prev },
          next
        });
        playSound(soundCheck);
        shouldAnimateDice = false;
        shouldAnimateDoublingCube = false;
        renderBoard();
        syncDiceSnapshotFromInputs();
      });
    }
    rollDiceBtn.addEventListener("click", () => {
      rollDiceRandomly();
    });
    if (enableShakeBtn) {
      enableShakeBtn.addEventListener("click", async () => {
        if (isShakeMotionListening) {
          stopShakeDiceRollListening();
          return;
        }
        await requestShakePermissionAndEnable();
      });
    }
    cubeValueInput.addEventListener("change", () => {
      playSound(soundRoll);
      recordDoublingCubeChangeIfNeeded();
    });
    exportPngBtn.addEventListener("click", savePng);
    paletteMenuBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      setPaletteMenuOpen(paletteMenuDropdown.hidden);
    });
    soundToggleBtn.addEventListener("click", () => {
      unlockAudioOnUserGesture();
      isSoundEnabled = !isSoundEnabled;
      syncSoundToggleButton();
      try {
        localStorage.setItem(SOUND_ENABLED_STORAGE_KEY, isSoundEnabled ? "1" : "0");
      } catch (_) {
        /* ignore */
      }
    });
    document.addEventListener("mousedown", (event) => {
      if (!paletteMenuDropdown || paletteMenuDropdown.hidden) {
        return;
      }
      const t = event.target;
      if (!(t instanceof Node)) {
        return;
      }
      if (paletteMenuBtn && paletteMenuBtn.parentElement.contains(t)) {
        return;
      }
      setPaletteMenuOpen(false);
    });
    flipBoardBtn.addEventListener("click", () => {
      isBoardFlipped = !isBoardFlipped;
      applyBoardFlip();
    });
    backBtn.addEventListener("click", undoLastEdit);
    clearBtn.addEventListener("click", () => {
      clearBoardState(false);
    });
    setupLongBtn.addEventListener("click", applyLongNardySetup);
    setupShortBtn.addEventListener("click", applyShortNardySetup);

    Object.entries(modeButtons).forEach(([mode, btn]) => {
      btn.addEventListener("click", () => {
        applyMode(mode);
        if (mode !== "delete") {
          stopDeleteHold();
          isDeleteDragging = false;
        }
      });
    });
    window.addEventListener("mouseup", () => {
      isDeleteDragging = false;
      stopDeleteHold();
    });
    window.addEventListener("touchstart", unlockAudioOnUserGesture, { passive: true });
    window.addEventListener("click", unlockAudioOnUserGesture);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        lastShakeMagnitude = null;
      }
    });
    window.addEventListener("resize", () => {
      setBoardScale(currentBoardScale);
    });
    window.addEventListener("mousedown", (event) => {
      const target = event.target;
      const clickedOnHitRect = target instanceof Element && target.closest(".hover-zone");
      if (clickedOnHitRect) {
        return;
      }
      if (lineStartPointIndex === null && moveStartPointId === null) {
        return;
      }
      lineStartPointIndex = null;
      moveStartPointId = null;
      renderBoard();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && paletteMenuDropdown && !paletteMenuDropdown.hidden) {
        event.preventDefault();
        setPaletteMenuOpen(false);
        paletteMenuBtn.focus();
        return;
      }
      const key = event.key.toLowerCase();
      const isUndoKey = (event.ctrlKey || event.metaKey) && !event.shiftKey && (key === "z" || key === "я");
      const isRedoKey = (event.ctrlKey || event.metaKey) && event.shiftKey && (key === "z" || key === "я");
      if (!isUndoKey && !isRedoKey) {
        return;
      }

      const target = event.target;
      const isTypingTarget = target instanceof HTMLElement && (
        target.tagName === "INPUT" ||
        target.tagName === "TEXTAREA" ||
        target.tagName === "SELECT" ||
        target.isContentEditable
      );
      if (isTypingTarget) {
        return;
      }

      event.preventDefault();
      if (isRedoKey) {
        redoLastEdit();
        return;
      }
      undoLastEdit();
    });

    initBoardPaletteFromStorage();
    initSoundFromStorage();
    applyCenterGapLayout();
    createPointLabels();
    createHitZones();
    syncPointLabelsVisibility();
    if (diceSizeSlider) {
      currentDiceSize = clampInt(diceSizeSlider.value, minDiceSize, maxDiceSize, defaultDiceSize);
      diceSizeSlider.value = String(currentDiceSize);
    }
    applyBoardFieldHeight(boardFieldHeightOffset);
    syncDiceSizeValue();
    syncFieldHeightValue();
    syncBoardGeometryStats();
    setBoardScale(getInitialBoardScale());
    syncDesktopPanelWidthFromCurrentScale();
    applyMode("move");
    applyBoardFlip();
    renderBoard();
    syncDiceSnapshotFromInputs();
  </script>
</body>
</html>
