<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Шешбеш редактор</title>
  <style>
    html {
      touch-action: manipulation;
      background: var(--bg);
      color-scheme: dark;
    }

    :root {
      /* Lichess-like page shell (SVG board markup unchanged) */
      --bg: #262421;
      --text: #ececea;
      --accent: #629924;
      --ui-surface: #3c3a37;
      --ui-surface-2: #454240;
      --ui-border: #5c5a57;
      --ui-text: #ececea;
      --ui-btn: #4a4845;
      --ui-btn-border: #6d6a67;
      --ui-btn-hover: #52504c;
      --ui-input-bg: #2f2d2b;
      --ui-input-border: #5a5653;
      --ui-chip-inner: #343230;
      --ui-active: #2a3228;
      --ui-active-border: #629924;
      --panel-font: Arial, Helvetica, sans-serif;
      --panel-font-size: 14px;
      --panel-line-height: 1.35;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: var(--panel-font);
      background: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      body {
        align-items: stretch;
        padding: 0;
      }

      .actions,
      .panel-modes,
      .panel-dice,
      .panel-board-size {
        width: 100% !important;
        max-width: 100% !important;
        border: none;
        border-radius: 0;
        box-sizing: border-box;
        padding-left: 0;
        padding-right: 0;
        align-self: stretch !important;
      }

      .actions button,
      .panel-modes .mode-btn,
      .panel-dice .mode-btn,
      .board-palette-chip {
        flex: 1 1 0;
        width: auto !important;
        min-width: 0;
      }

      .board-palette-chip {
        height: 36px;
      }

      .board-palette-wrap {
        width: 100% !important;
        height: 100% !important;
      }

      .board-palette-dropdown {
        width: 100% !important;
      }

      .actions--toolbar,
      .actions--setup,
      .panel-modes,
      .panel-dice,
      .panel-board-size {
        margin-top: 4px;
        margin-bottom: 0;
      }

      #boardSvg {
        align-self: stretch;
        margin: 4px 0 0;
        max-width: none;
      }
    }

    #boardSvg {
      width: 671.167px;
      height: auto;
      display: block;
      margin: 6px auto 0;
      align-self: center;
      max-width: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .actions,
    .panel-modes,
    .panel-dice,
    .panel-board-size {
      width: min(var(--desktop-panel-width, 404px), 100%);
      box-sizing: border-box;
    }

    svg text {
      user-select: none;
      -webkit-user-select: none;
    }

    .point-label {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      user-select: none;
      padding: 6px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      background: var(--ui-surface);
      color: var(--ui-text);
      font-family: var(--panel-font);
      font-size: var(--panel-font-size);
      line-height: var(--panel-line-height);
    }

    .actions--setup,
    .actions--toolbar,
    .panel-modes,
    .panel-dice,
    .panel-board-size {
      margin-top: 6px;
      margin-bottom: 0;
    }

    .actions--toolbar {
      align-self: center;
    }

    .actions button {
      padding: 8px 12px;
      height: 36px;
      min-height: 36px;
      border: 1px solid var(--ui-btn-border);
      border-radius: 6px;
      background: var(--ui-btn);
      color: var(--ui-text);
      cursor: pointer;
      font: inherit;
      box-sizing: border-box;
    }

    .actions button:hover {
      background: var(--ui-btn-hover);
    }

    .actions button.active {
      border-color: var(--ui-active-border);
      box-shadow: inset 0 0 0 1px var(--ui-active-border);
      background: var(--ui-active);
    }

    .panel-modes {
      display: grid;
      gap: 4px;
      padding: 6px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      background: var(--ui-surface);
      color: var(--ui-text);
      user-select: none;
      font-family: var(--panel-font);
      font-size: var(--panel-font-size);
      line-height: var(--panel-line-height);
    }

    .ui-icon-btn {
      width: 48px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .panel-dice {
      display: grid;
      gap: 4px;
      padding: 6px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      background: var(--ui-surface);
      color: var(--ui-text);
      user-select: none;
      font-family: var(--panel-font);
      font-size: var(--panel-font-size);
      line-height: var(--panel-line-height);
    }

    .panel-board-size {
      display: grid;
      gap: 4px;
      padding: 6px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 8px;
      background: var(--ui-surface);
      color: var(--ui-text);
      user-select: none;
      font-family: var(--panel-font);
      font-size: var(--panel-font-size);
      line-height: var(--panel-line-height);
      width: min(var(--desktop-panel-width, 404px), 100%);
      box-sizing: border-box;
    }

    .panel-board-size label {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: space-between;
    }

    .panel-board-size input[type="range"] {
      flex: 1;
      min-width: 140px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .panel-board-size-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .mode-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      height: 36px;
      min-height: 36px;
      border: 1px solid var(--ui-btn-border);
      border-radius: 6px;
      background: var(--ui-btn);
      color: var(--ui-text);
      cursor: pointer;
      user-select: none;
      font: inherit;
      box-sizing: border-box;
    }

    .mode-btn:hover {
      background: var(--ui-btn-hover);
    }

    .mode-btn.active {
      border-color: var(--ui-active-border);
      box-shadow: inset 0 0 0 1px var(--ui-active-border);
      background: var(--ui-active);
      color: var(--ui-text);
    }

    #enableShakeBtn {
      display: none;
    }

    @media (hover: none) and (pointer: coarse) {
      #enableShakeBtn {
        display: inline-flex;
      }
    }

    .checker-icon {
      --checker-icon-size: 15px;
      width: var(--checker-icon-size);
      height: var(--checker-icon-size);
      border-radius: 50%;
      border: 2px solid #222;
      display: inline-block;
      box-sizing: border-box;
      position: relative;
    }

    .checker-icon--white {
      background: var(--checker-white-bg, #ffffff);
      border-color: var(--checker-white-bd, #111111);
    }

    .checker-icon--black {
      background: var(--checker-black-bg, #0d0d14);
      border-color: var(--checker-black-bd, #e9c891);
    }

    .checker-icon--gray {
      background: #9a9a9a;
      border-color: #6f6f6f;
    }

    .checker-icon--erase {
      background: #9a9a9a;
      border-color: #6f6f6f;
    }

    .checker-icon--erase::before,
    .checker-icon--erase::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: calc(var(--checker-icon-size) - 1px);
      background: #d22;
      border-radius: 1px;
      transform-origin: center;
    }

    .checker-icon--erase::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .checker-icon--erase::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .undo-icon-outline {
      stroke: #082a72;
      stroke-width: 4.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .undo-icon-main {
      stroke: #2f77ff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .line-draw-icon-path {
      stroke: #7cc7ff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .line-draw-icon-point {
      fill: #7cc7ff;
      stroke: #1e4a8a;
      stroke-width: 1.2;
    }

    .cube-x2-icon-box {
      fill: #4d6f3a;
      stroke: #2c4e23;
      stroke-width: 1.4;
      rx: 2.5;
      ry: 2.5;
    }

    .cube-x2-icon-text {
      fill: #e8eaff;
      font-size: 9px;
      font-weight: 700;
      font-family: Arial, Helvetica, sans-serif;
      dominant-baseline: central;
      text-anchor: middle;
    }

    .move-icon-overlap {
      display: inline-flex;
      align-items: center;
      position: relative;
      line-height: 1;
    }

    .move-icon-overlap .checker-icon {
      margin-right: -5px;
      z-index: 2;
    }

    .move-icon-hand-emoji {
      position: relative;
      z-index: 1;
      font-size: 15px;
      transform: translateY(0.5px);
    }

    .roll-icon-overlap {
      display: inline-flex;
      align-items: center;
      position: relative;
      line-height: 1;
    }

    .roll-icon-die {
      position: relative;
      z-index: 2;
      margin-right: -5px;
      transform: translateY(-0.5px);
    }

    .roll-icon-hand {
      position: relative;
      z-index: 1;
      font-size: 15px;
      transform: translateY(0.5px);
    }

    .dice-reset-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      line-height: 1;
      font-size: 15px;
    }

    .dice-reset-icon::before,
    .dice-reset-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 16px;
      background: #d22;
      border-radius: 1px;
      transform-origin: center;
      z-index: 2;
      pointer-events: none;
    }

    .dice-reset-icon::before {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .dice-reset-icon::after {
      transform: translate(-50%, -50%) rotate(-45deg);
    }

    .hover-zone {
      fill: #fff;
      opacity: 0;
      cursor: inherit;
      transition: opacity 120ms ease-out;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    /* :hover on touch (first tap) stole the gesture; only dim on real hover. */
    @media (hover: hover) and (pointer: fine) {
      .hover-zone:hover {
        opacity: 0.1;
      }
    }

    .scale-input {
      width: 70px;
      padding: 5px 6px;
      border: 1px solid var(--ui-input-border);
      border-radius: 4px;
      background: var(--ui-input-bg);
      color: var(--ui-text);
    }

    input[type="number"],
    select {
      padding: 4px 6px;
      border: 1px solid var(--ui-input-border);
      border-radius: 4px;
      background: var(--ui-input-bg);
      color: var(--ui-text);
    }

    .control-like {
      height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--ui-input-border);
      border-radius: 6px;
      background: var(--ui-input-bg);
      color: var(--ui-text);
      box-sizing: border-box;
      font: inherit;
    }

    select.control-like {
      min-width: 72px;
      cursor: pointer;
    }

    input.control-like {
      width: 90px;
    }

    .value-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      background: var(--ui-surface-2);
      color: var(--ui-text);
      box-sizing: border-box;
      font: inherit;
      line-height: var(--panel-line-height);
    }

    .value-chip .control-like {
      height: 28px;
      min-width: 58px;
      padding: 4px 4px;
      border: 1px solid var(--ui-input-border);
      border-radius: 6px;
      background: var(--ui-chip-inner);
      color: var(--ui-text);
      line-height: var(--panel-line-height);
    }

    .board-palette-wrap {
      position: relative;
      display: inline-block;
      width: 100%;
      height: 100%;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .board-palette-chip {
      width: 48px;
      height: 36px;
      padding: 0;
      justify-content: center;
      border-color: var(--ui-btn-border);
      background: var(--ui-btn);
    }

    .board-palette-trigger {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 1px solid var(--ui-btn-border);
      border-radius: 6px;
      background: var(--ui-btn);
      cursor: pointer;
      position: relative;
      box-sizing: border-box;
    }

    .board-palette-trigger:hover {
      background: var(--ui-btn-hover);
    }

    .board-palette-chip:has(.board-palette-trigger[aria-expanded="true"]) {
      border-color: var(--ui-active-border);
      box-shadow: inset 0 0 0 1px var(--ui-active-border);
      background: var(--ui-active);
    }

    .board-palette-trigger:focus-visible {
      outline: 2px solid var(--ui-text);
      outline-offset: 2px;
    }

    .board-palette-swatch {
      position: absolute;
      width: 24px;
      height: 24px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 2px;
      box-sizing: border-box;
      pointer-events: none;
      background-image: linear-gradient(to right, #c9b797 0 50%, #ff4422 50% 100%);
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    .board-palette-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      left: auto;
      width: 100%;
      min-width: 48px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 4px;
      margin: 0;
      list-style: none;
      background: var(--ui-surface-2);
      border: 1px solid var(--ui-border);
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      box-sizing: border-box;
    }

    .board-palette-dropdown[hidden] {
      display: none !important;
    }

    .board-palette-dropdown .board-palette-option {
      display: block;
      width: 24px !important;
      height: 24px !important;
      min-width: 24px !important;
      min-height: 24px !important;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      margin: 0;
      padding: 0 !important;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      box-sizing: border-box;
      line-height: 0;
      background-clip: padding-box;
    }

    .board-palette-option:hover {
      filter: brightness(1.06);
    }

    .board-palette-option[aria-selected="true"] {
      border-color: var(--ui-text);
    }

    .board-palette-option:focus-visible {
      outline: 2px solid var(--ui-text);
      outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div class="panel-board-size" aria-label="Размер игрового поля">
    <label>
      <span>Высота поля</span>
      <input id="fieldHeightSlider" type="range" min="0" max="220" step="1" value="90" />
      <span id="fieldHeightValue" class="value-chip">90%</span>
    </label>
    <label>
      <span>Размер кубиков</span>
      <input id="diceSizeSlider" type="range" min="30" max="72" step="1" value="40" />
      <span id="diceSizeValue" class="value-chip">40px</span>
    </label>
    <div class="panel-board-size-stats">
      <span id="fieldHeightPxValue" class="value-chip">Высота поля: 624px</span>
      <span id="fieldSpaceWidthValue" class="value-chip">Ширина поля: 589.6px</span>
    </div>
  </div>

  <div class="actions actions--toolbar" aria-label="Экспорт и вид доски">
      <button id="exportPngBtn" class="ui-icon-btn" type="button">💾</button>
      <button id="flipBoardBtn" class="ui-icon-btn" type="button">🔄</button>
      <button id="zoomOutBtn" class="ui-icon-btn" type="button">🔍</button>
      <button id="zoomInBtn" class="ui-icon-btn" type="button">🔎</button>
      <div class="value-chip board-palette-chip">
        <div class="board-palette-wrap">
          <input type="hidden" id="boardPaletteKeyInput" value="classic" />
          <button
            type="button"
            id="paletteMenuBtn"
            class="board-palette-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="paletteMenuDropdown"
            title="Цветовая тема доски и шашек"
            aria-label="Выбор палитры доски"
          >
            <span id="paletteSwatchPreview" class="board-palette-swatch" aria-hidden="true"></span>
          </button>
          <div id="paletteMenuDropdown" class="board-palette-dropdown" role="listbox" hidden aria-label="Палитры"></div>
        </div>
      </div>
      <button id="soundToggleBtn" class="ui-icon-btn" type="button" aria-label="Переключить звук" title="Звук">🔊</button>
    </div>

    <div class="actions actions--setup" aria-label="Расстановка и отмена">
      <button id="clearBtn" class="ui-icon-btn" type="button">💣</button>
      <button id="setupLongBtn" type="button">Длинные⚡</button>
      <button id="setupShortBtn" type="button">Короткие⚡</button>
    </div>

    <div class="panel-modes" aria-label="Режимы редактирования">
      <div class="row">
        <button id="modeMoveBtn" class="mode-btn ui-icon-btn active" type="button" data-mode="move" aria-label="Ход" title="Ход">
          <span class="move-icon-overlap">
            <span class="checker-icon checker-icon--gray"></span><span class="move-icon-hand-emoji">👋</span>
          </span>
        </button>
        <button id="modeLinesBtn" class="mode-btn ui-icon-btn" type="button" data-mode="lines" aria-label="Рисовать линии" title="Рисовать линии">
          <svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true" focusable="false">
            <path class="line-draw-icon-path" d="M2 11 C6 3, 12 3, 18 11"/>
            <circle class="line-draw-icon-point" cx="2" cy="11" r="1.8"/>
            <circle class="line-draw-icon-point" cx="18" cy="11" r="1.8"/>
          </svg>
        </button>
        <button id="modeWhiteBtn" class="mode-btn ui-icon-btn" type="button" data-mode="white">+ <span class="checker-icon checker-icon--white"></span></button>
        <button id="modeBlackBtn" class="mode-btn ui-icon-btn" type="button" data-mode="black">+ <span class="checker-icon checker-icon--black"></span></button>
        <button id="modeDeleteBtn" class="mode-btn ui-icon-btn" type="button" data-mode="delete">− <span class="checker-icon checker-icon--erase"></span></button>
        <button id="backBtn" class="mode-btn ui-icon-btn" type="button" aria-label="Вернуть" title="Вернуть">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false" style="transform: translateX(-1px);">
            <path class="undo-icon-outline" d="M10 7L5 12L10 17"/>
            <path class="undo-icon-outline" d="M6 12H18C20.209 12 23 13.791 23 16"/>
            <path class="undo-icon-main" d="M10 7L5 12L10 17"/>
            <path class="undo-icon-main" d="M6 12H18C20.209 12 23 13.791 23 16"/>
          </svg>
        </button>
      </div>
    </div>

    <svg id="boardSvg" xmlns="http://www.w3.org/2000/svg" viewBox="255.417 0 613.167 669" width="613.167" height="669" role="img" aria-label="Игровая доска">
      <g id="boardContent">
        <defs id="arrowDefs"></defs>
        <rect x="255.417" y="0" width="613.167" height="669" rx="20" ry="20" data-board="frame" fill="#423122" stroke="#000" stroke-width="1"/>
        <rect x="267.208" y="22" width="283" height="624" data-board="field" fill="#4a6439"/>
        <rect x="573.792" y="22" width="283" height="624" data-board="field" fill="#4a6439"/>

        <g id="boardTriangleFields">
        <path data-tri="a" d="M250 22 L272.583 208.667 A2 7.915 0 0 0 274.583 208.667 L297.167 22z" fill="#c9b797"/>
        <path data-tri="b" d="M297.167 22 L319.75 208.667 A2 7.915 0 0 0 321.75 208.667 L344.333 22z" fill="#f42"/>
        <path data-tri="a" d="M344.333 22 L366.917 208.667 A2 7.915 0 0 0 368.917 208.667 L391.5 22z" fill="#c9b797"/>
        <path data-tri="b" d="M391.5 22 L414.083 208.667 A2 7.915 0 0 0 416.083 208.667 L438.667 22z" fill="#f42"/>
        <path data-tri="a" d="M438.667 22 L461.25 208.667 A2 7.915 0 0 0 463.25 208.667 L485.833 22z" fill="#c9b797"/>

      const preferred = isAppleMobile
        ? [
          { ext: "m4a", mime: "audio/mp4; codecs=\"mp4a.40.2\"" },
          { ext: "mp3", mime: "audio/mpeg" },
          { ext: "ogg", mime: "audio/ogg; codecs=\"vorbis\"" }
        ]

          { ext: "ogg", mime: "audio/ogg; codecs=\"vorbis\"" },
          { ext: "m4a", mime: "audio/mp4; codecs=\"mp4a.40.2\"" }
        ];

      const picked = preferred.find((f) => supports(f.mime));
      const ext = picked ? picked.ext : "mp3";
      return `sounds/${baseName}.${ext}`;

      return {

      };

        return d.includes("533.") || d.includes("529 ") || d.includes("590.") || d.includes("595 ");
      });

    const pointStacks = Array.from({ length: 24 }, () => []);

    function getPathStartX(pathNode) {
      const d = pathNode.getAttribute("d") || "";
      const m = d.match(/^M\s*([0-9.]+)/);
      if (!m) {
        return NaN;
      }
      return Number.parseFloat(m[1]);
    }

    function getSideHorizontalShift(pathNode) {
      const startX = getPathStartX(pathNode);
      if (!Number.isFinite(startX)) {
        return 0;
      }
      return startX < barX ? boardCenterShift : -boardCenterShift;
    }

    function applyCenterGapLayout() {
      sideTrianglePaths.forEach((path) => {
        path.setAttribute("transform", `translate(${getSideHorizontalShift(path)} 0)`);
      });
      innerCornerPaths.forEach((path) => {
        path.setAttribute("transform", `translate(${getSideHorizontalShift(path)} 0)`);
      });
    }

    function cursorSvg(color, stroke, glyph = "") {
      const text = glyph ? `<text x='12' y='14' font-size='12'>${glyph}</text>` : "";
      return `data:image/svg+xml;utf8,${encodeURIComponent(
        `<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'>
          <circle cx='11' cy='11' r='8' fill='${color}' stroke='${stroke}' stroke-width='2'/>
          ${text}
        </svg>`
      )}`;
    }

    function whiteArrowCursorSvg() {
      return `data:image/svg+xml;utf8,${encodeURIComponent(
        `<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'>
          <path d='M2 2 L21 11 L13 12.5 L16.2 22 L12.6 23 L9.4 13.4 L2 2 Z' fill='#ffffff' stroke='#1f1f1f' stroke-width='1.2' stroke-linejoin='round'/>
        </svg>`
      )}`;
    }

    function getModeCursorMap() {
      const p = getActivePalette();
      return {
        white: `url("${cursorSvg(p.checkerWhiteFill, p.checkerWhiteStroke)}") 11 11, pointer`,
        black: `url("${cursorSvg(p.checkerBlackFill, p.checkerBlackStroke)}") 11 11, pointer`,
        lines: `url("${whiteArrowCursorSvg()}") 2 2, pointer`,
        move: "default",
        delete: `url("${cursorSvg("#ffd9d9", "#994444")}") 11 11, pointer`
      };
    }

    function applyMode(mode) {
      editMode = mode;
      Object.entries(modeButtons).forEach(([name, btn]) => {
        btn.classList.toggle("active", name === mode);
      });
      document.body.style.cursor = getModeCursorMap()[mode];
      arrowHitLayer.setAttribute("pointer-events", mode === "delete" ? "auto" : "none");
      if (mode !== "lines") {
        lineStartPointIndex = null;
      }
      if (mode !== "move") {
        moveStartPointId = null;
      }
      renderBoard();
    }

    function checkerStyleForColor(color) {
      const p = getActivePalette();
      return color === "white"
        ? { fill: p.checkerWhiteFill, stroke: p.checkerWhiteStroke, textColor: p.checkerWhiteText }
        : { fill: p.checkerBlackFill, stroke: p.checkerBlackStroke, textColor: p.checkerBlackText };
    }

    function clampInt(value, min, max, fallback) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) {
        return fallback;
      }
      return Math.max(min, Math.min(max, parsed));
    }

    function applyTextFlipCompensation(textNode) {
      const x = Number.parseFloat(textNode.getAttribute("x"));
      const y = Number.parseFloat(textNode.getAttribute("y"));
      if (!Number.isFinite(x) || !Number.isFinite(y)) {
        return;
      }
      if (isBoardFlipped) {
        textNode.setAttribute("transform", `rotate(180 ${x} ${y})`);
        return;
      }
      textNode.removeAttribute("transform");
    }

    function getCheckerAnimatedDeltaY(point, stackLength, i, animation) {
      if (!animation) {
        return 0;
      }
      const step = getTowerStep(stackLength);
      const oldStep = getTowerStep(animation.fromCount);
      const cy = point.startY + point.direction * i * step;
      let fromCy = cy;
      if (i < animation.fromCount) {
        fromCy = point.startY + point.direction * i * oldStep;
      } else {
        const prevTopIndex = Math.max(0, animation.fromCount - 1);
        fromCy = point.startY + point.direction * prevTopIndex * oldStep;
      }
      return fromCy - cy;
    }

    function addCountLabel(x, y, count, textColor, startOffsetY) {
      const text = document.createElementNS(svgNs, "text");
      text.setAttribute("x", String(x));
      text.setAttribute("y", String(y));
      text.setAttribute("fill", textColor);
      text.setAttribute("font-size", "22");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "middle");
      text.setAttribute("font-family", "Arial");
      text.setAttribute("font-weight", "bold");
      text.textContent = String(count);
      applyTextFlipCompensation(text);

      const doOffset = Number.isFinite(startOffsetY) && Math.abs(startOffsetY) > 0.01;
      if (doOffset) {
        const g = document.createElementNS(svgNs, "g");
        g.appendChild(text);
        g.style.transition = "none";
        g.style.transform = `translateY(${startOffsetY}px)`;
        requestAnimationFrame(() => {
          g.style.transition = "transform 500ms cubic-bezier(0.22, 1, 0.36, 1)";
          g.style.transform = "translateY(0px)";
        });
        countLabelsLayer.appendChild(g);
        return;
      }
      countLabelsLayer.appendChild(text);
    }

    function getTowerStep(count) {
      if (count <= 1) {
        return defaultStep;
      }
      if (count <= 5) {
        return defaultStep;
      }
      return Math.min(defaultStep, maxTowerSpan / (count - 1));
    }

    function drawTower(pointIndex, stack) {
      if (stack.length === 0) {
        return;
      }
      const point = pointDefs[pointIndex];
      const topColor = stack[stack.length - 1];
      const style = checkerStyleForColor(topColor);
      const step = getTowerStep(stack.length);
      let topX = point.x;
      let topY = point.startY;
      const animation = pendingTowerShiftAnimations.get(pointIndex) || null;
      const oldStep = animation ? getTowerStep(animation.fromCount) : step;

      for (let i = 0; i < stack.length; i += 1) {
        const isHiddenMovingTargetChecker = moveInFlight
          && moveInFlight.toPointId === String(pointIndex)
          && i === stack.length - 1;
        if (isHiddenMovingTargetChecker) {
          continue;
        }
        const cx = point.x;
        const cy = point.startY + point.direction * i * step;
        const currentStyle = checkerStyleForColor(stack[i]);
        topX = cx;
        topY = cy;
        const circle = document.createElementNS(svgNs, "circle");
        circle.setAttribute("cx", String(cx));
        circle.setAttribute("cy", String(cy));
        circle.setAttribute("r", String(radius));
        circle.setAttribute("fill", currentStyle.fill);
        const isMoveSelected =
          editMode === "move" &&
          moveStartPointId === String(pointIndex) &&
          i === stack.length - 1;
        circle.setAttribute("stroke", isMoveSelected ? "#0077FF" : currentStyle.stroke);
        circle.setAttribute("stroke-width", isMoveSelected ? "5" : "3");
        if (isMoveSelected) {
          circle.setAttribute("stroke-dasharray", "9 6");
          const spin = document.createElementNS(svgNs, "animateTransform");
          spin.setAttribute("attributeName", "transform");
          spin.setAttribute("type", "rotate");
          spin.setAttribute("from", `0 ${cx} ${cy}`);
          spin.setAttribute("to", `360 ${cx} ${cy}`);
          spin.setAttribute("dur", "2800ms");
          spin.setAttribute("repeatCount", "indefinite");
          circle.appendChild(spin);
        }
        if (animation) {
          let fromCy = cy;
          if (i < animation.fromCount) {
            fromCy = point.startY + point.direction * i * oldStep;
          } else {
            const prevTopIndex = Math.max(0, animation.fromCount - 1);
            fromCy = point.startY + point.direction * prevTopIndex * oldStep;
          }
          const deltaY = fromCy - cy;
          if (Math.abs(deltaY) > 0.01) {
            circle.style.transform = `translateY(${deltaY}px)`;
            circle.style.transition = "none";
            requestAnimationFrame(() => {
              circle.style.transition = "transform 500ms cubic-bezier(0.22, 1, 0.36, 1)";
              circle.style.transform = "translateY(0px)";
            });
          }
        }
        getCheckerSvgLayerForPointId(pointIndex).appendChild(circle);
      }

      if (stack.length > 5) {
        const fixedLabelY = point.startY + point.direction * maxTowerSpan;
        const shrinkAnim =
          animation && animation.fromCount > stack.length ? animation : null;
        const growAnim =
          animation && animation.fromCount < stack.length ? animation : null;
        const topIdx = stack.length - 1;
        const labelStartOffsetY = shrinkAnim
          ? getCheckerAnimatedDeltaY(point, stack.length, topIdx, shrinkAnim)
          : growAnim
            ? getCheckerAnimatedDeltaY(point, stack.length, topIdx, growAnim)
            : 0;
        addCountLabel(topX, fixedLabelY, stack.length, style.textColor, labelStartOffsetY);
      }
    }

    function drawBarCheckers() {
      const barOrder = [
        { section: "top", y: barTopY },
        { section: "bottom", y: barBottomY }
      ];

      barOrder.forEach(({ section, y }) => {
        const stack = barStacks[section];
        const count = stack.length;
        if (count === 0) {
          return;
        }
        if (moveInFlight && moveInFlight.toPointId === `bar-${section}` && count === 1) {
          return;
        }
        const color = stack[count - 1];
        const style = checkerStyleForColor(color);
        const circle = document.createElementNS(svgNs, "circle");
        circle.setAttribute("cx", String(barX));
        circle.setAttribute("cy", String(y));
        circle.setAttribute("r", String(radius));
        circle.setAttribute("fill", style.fill);
        const isMoveSelected =
          editMode === "move" &&
          moveStartPointId === `bar-${section}`;
        circle.setAttribute("stroke", isMoveSelected ? "#0077FF" : style.stroke);
        circle.setAttribute("stroke-width", isMoveSelected ? "5" : "3");
        if (isMoveSelected) {
          circle.setAttribute("stroke-dasharray", "9 6");
          const spin = document.createElementNS(svgNs, "animateTransform");
          spin.setAttribute("attributeName", "transform");
          spin.setAttribute("type", "rotate");
          spin.setAttribute("from", `0 ${barX} ${y}`);
          spin.setAttribute("to", `360 ${barX} ${y}`);
          spin.setAttribute("dur", "2800ms");
          spin.setAttribute("repeatCount", "indefinite");
          circle.appendChild(spin);
        }
        // Bar checkers must always stay above regular towers.
        checkersOverArrowsLayer.appendChild(circle);
        if (count > 1) {
          addCountLabel(barX, y, count, style.textColor);
        }
      });
    }

    function createPointLabels() {
      pointLabelsLayer.replaceChildren();
      pointDefs.forEach((point, idx) => {
        const text = document.createElementNS(svgNs, "text");
        text.setAttribute("x", String(point.x));
        text.setAttribute("y", point.direction === 1 ? pointLabelTopY : pointLabelBottomY);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "central");
        text.setAttribute("fill", "#e8eaff");
        text.setAttribute("font-size", "11");
        text.setAttribute("font-family", "Arial");
        text.setAttribute("class", "point-label");
        text.textContent = String(idx + 1);
        applyTextFlipCompensation(text);
        pointLabelsLayer.appendChild(text);
      });
    }

    function syncPointLabelsVisibility() {
      pointLabelsLayer.setAttribute("visibility", "visible");
    }

    /** Один и тот же внешний «бокс» кости и куба удвоения при заданном `size` (ползунок кубиков). */
    function getGameDieBoxMetrics(size) {
      const s = size;
      return {
        cornerRadius: Math.max(3, s * 0.09),
        strokeWidth: Math.max(1, (s * 2) / defaultDiceSize)
      };
    }

    function drawDie(x, y, size, value, animateSpin = false, animationDelayMs = 0) {
      const dieSize = size;
      const { cornerRadius, strokeWidth } = getGameDieBoxMetrics(dieSize);
      const pipRadius = dieSize * 0.1;
      const offsetSmall = dieSize * (7.6 / 35);
      const offsetMid = dieSize * 0.5;
      const offsetLarge = dieSize * (27.4 / 35);
      const dieGroup = document.createElementNS(svgNs, "g");
      dieGroup.setAttribute("style", "transform-box: fill-box; transform-origin: center;");

      const die = document.createElementNS(svgNs, "rect");
      die.setAttribute("x", String(x));
      die.setAttribute("y", String(y));
      die.setAttribute("width", String(dieSize));
      die.setAttribute("height", String(dieSize));
      die.setAttribute("rx", String(cornerRadius));
      die.setAttribute("ry", String(cornerRadius));
      die.setAttribute("fill", "#fff");
      die.setAttribute("stroke", "#ccc");
      die.setAttribute("stroke-width", String(strokeWidth));
      dieGroup.appendChild(die);

      const positions = {
        tl: [x + offsetSmall, y + offsetSmall],
        tc: [x + offsetMid, y + offsetSmall],
        tr: [x + offsetLarge, y + offsetSmall],
        ml: [x + offsetSmall, y + offsetMid],
        mc: [x + offsetMid, y + offsetMid],
        mr: [x + offsetLarge, y + offsetMid],
        bl: [x + offsetSmall, y + offsetLarge],
        bc: [x + offsetMid, y + offsetLarge],
        br: [x + offsetLarge, y + offsetLarge]
      };

      const map = {
        1: ["mc"],
        2: ["tl", "br"],
        3: ["tl", "mc", "br"],
        4: ["tl", "tr", "bl", "br"],
        5: ["tl", "tr", "mc", "bl", "br"],
        6: ["tl", "tr", "ml", "mr", "bl", "br"]
      };

      map[value].forEach((key) => {
        const [cx, cy] = positions[key];
        const pip = document.createElementNS(svgNs, "circle");
        pip.setAttribute("cx", String(cx));
        pip.setAttribute("cy", String(cy));
        pip.setAttribute("r", String(pipRadius));
        pip.setAttribute("fill", "#0d0d14");
        dieGroup.appendChild(pip);
      });
      extrasLayer.appendChild(dieGroup);
      if (animateSpin) {
        animateDieRollIn(dieGroup, animationDelayMs);
      }
    }

    function animateDieRollIn(dieGroup, delayMs = 0) {
      if (!(dieGroup instanceof SVGElement) || typeof dieGroup.animate !== "function") {
        return;
      }
      const startTransform = "translateX(220px) rotate(-540deg)";
      dieGroup.style.transform = startTransform;
      dieGroup.style.opacity = "0.95";
      const animation = dieGroup.animate(
        [
          { transform: startTransform, opacity: 0.95 },
          { transform: "translateX(110px) rotate(-300deg)", offset: 0.45, opacity: 1 },
          { transform: "translateX(-8px) rotate(20deg)", offset: 0.82, opacity: 1 },
          { transform: "translateX(0px) rotate(0deg)", opacity: 1 }
        ],
        {
          duration: 820,
          delay: Math.max(0, Number(delayMs) || 0),
          easing: "cubic-bezier(0.18, 0.9, 0.22, 1)",
          fill: "forwards"
        }
      );
      animation.addEventListener("finish", () => {
        dieGroup.style.transform = "";
        dieGroup.style.opacity = "1";
      });
    }

    function animateDoublingCubeSpin(cubeGroup) {
      if (!(cubeGroup instanceof SVGElement) || typeof cubeGroup.animate !== "function") {
        return;
      }
      cubeGroup.animate(
        [
          { transform: "rotate(0deg) scale(1)" },
          { transform: "rotate(140deg) scale(0.95)", offset: 0.24 },
          { transform: "rotate(300deg) scale(1.04)", offset: 0.58 },
          { transform: "rotate(380deg) scale(0.98)", offset: 0.78 },
          { transform: "rotate(352deg) scale(1.01)", offset: 0.9 },
          { transform: "rotate(360deg) scale(1)" }
        ],
        {
          duration: 760,
          easing: "cubic-bezier(0.2, 0.95, 0.25, 1)",
          fill: "none"
        }
      );
    }

    function drawDoublingCube(value, x, y, size, animateSpin = false) {
      const pal = getActivePalette();
      const { cornerRadius, strokeWidth } = getGameDieBoxMetrics(size);
      const cubeGroup = document.createElementNS(svgNs, "g");
      cubeGroup.setAttribute("style", "transform-box: fill-box; transform-origin: center;");
      const cube = document.createElementNS(svgNs, "rect");
      cube.setAttribute("x", String(x));
      cube.setAttribute("y", String(y));
      cube.setAttribute("width", String(size));
      cube.setAttribute("height", String(size));
      cube.setAttribute("rx", String(cornerRadius));
      cube.setAttribute("ry", String(cornerRadius));
      cube.setAttribute("fill", pal.cubeFill);
      cube.setAttribute("stroke", pal.cubeStroke);
      cube.setAttribute("stroke-width", String(strokeWidth));
      cubeGroup.appendChild(cube);

      const text = document.createElementNS(svgNs, "text");
      text.setAttribute("x", String(x + size / 2));
      text.setAttribute("y", String(y + size / 2));
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "central");
      text.setAttribute("fill", pal.cubeText);
      text.setAttribute("font-size", String(Math.max(14, Math.round(size * 0.44))));
      text.setAttribute("font-weight", "bold");
      text.textContent = String(value);
      applyTextFlipCompensation(text);
      cubeGroup.appendChild(text);
      extrasLayer.appendChild(cubeGroup);

      if (animateSpin) {
        animateDoublingCubeSpin(cubeGroup);
      }
    }

    function getPointTopCheckerAnchor(pointIndex) {
      const point = pointDefs[pointIndex];
      const stack = pointStacks[pointIndex];
      const step = stack.length <= 5 ? defaultStep : Math.min(defaultStep, maxTowerSpan / (stack.length - 1));
      const checkerTopY = stack.length > 0
        ? point.startY + point.direction * (stack.length - 1) * step
        : point.startY;
      return { x: point.x, y: checkerTopY };
    }

    function getCurrentFieldBottomY() {
      return baseFieldTopY + (baseFieldHeight - boardFieldHeightOffset);
    }

    function getAnchorForArrow(targetId, isEndAnchor = false) {
      if (targetId === "bar-top" || targetId === "bar-bottom") {
        const stack = barStacks[targetId === "bar-top" ? "top" : "bottom"];
        const y = targetId === "bar-top" ? barTopY : barBottomY;
        if (stack.length > 0) {
          if (isEndAnchor) {
            return { x: barX, y: y - radius };
          }
          return { x: barX, y };
        }
        const emptyBarOffset = cellWidth * 0.1;
        return { x: barX, y: isEndAnchor ? y - emptyBarOffset : y };
      }

      const pointIndex = Number(targetId);
      if (!Number.isInteger(pointIndex) || pointIndex < 0 || pointIndex >= pointDefs.length) {
        return { x: barX, y: baseFieldTopY + (baseFieldHeight - boardFieldHeightOffset) / 2 };
      }
      const point = pointDefs[pointIndex];
      const stack = pointStacks[pointIndex];
      if (stack.length > 0) {
        const topChecker = getPointTopCheckerAnchor(pointIndex);
        if (isEndAnchor) {
          return {
            x: topChecker.x,
            y: topChecker.y + point.direction * radius
          };
        }
        return topChecker;
      }
      // For empty points, end anchor sits slightly above triangle edge.
      const emptyEndOffset = cellWidth * 0.1;
      const fieldTopY = baseFieldTopY;
      const fieldBottomY = getCurrentFieldBottomY();
      return {
        x: point.x,
        y: point.direction === 1
          ? (isEndAnchor ? fieldTopY + emptyEndOffset : fieldTopY)
          : (isEndAnchor ? fieldBottomY - emptyEndOffset : fieldBottomY)
      };
    }

    function getArrowGeometry(fromTargetId, toTargetId) {
      const from = getAnchorForArrow(fromTargetId, false);
      const to = getAnchorForArrow(toTargetId, true);
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const distance = Math.hypot(dx, dy) || 1;
      const midX = (from.x + to.x) / 2;
      const midY = (from.y + to.y) / 2;
      const centerX = 562;
      const centerY = baseFieldTopY + (baseFieldHeight - boardFieldHeightOffset) / 2;
      const towardCenterLineY = centerY - midY;
      const horizontalSpan = Math.abs(dx);
      const curve = Math.min(320, Math.max(90, distance * 0.74));
      const horizontalBend = Math.max(28, curve * 0.22);
      const baseControlX = midX + Math.sign(centerX - midX || 1) * horizontalBend;
      const towardCenterSign = Math.sign(towardCenterLineY) || (midY <= centerY ? 1 : -1);
      const centerPullMagnitude = Math.max(Math.abs(towardCenterLineY), 74);
      const verticalPull = towardCenterSign * centerPullMagnitude * 0.96;
      const verticalOvershoot = towardCenterSign * Math.min(140, Math.max(44, horizontalSpan * 0.26));
      const baseControlY = midY + verticalPull + verticalOvershoot;

      // Taller start columns shift bend closer to line end.
      let sourceStackHeight = 0;
      if (fromTargetId === "bar-top" || fromTargetId === "bar-bottom") {
        sourceStackHeight = (fromTargetId === "bar-top" ? barStacks.top.length : barStacks.bottom.length);
      } else {
        const fromPointIndex = Number(fromTargetId);
        if (Number.isInteger(fromPointIndex) && fromPointIndex >= 0 && fromPointIndex < pointStacks.length) {
          sourceStackHeight = pointStacks[fromPointIndex].length;
        }
      }
      const normalizedHeight = Math.max(0, sourceStackHeight - 1);
      let endBias = Math.min(0.62, Math.pow(normalizedHeight / 5, 1.35) * 0.62);
      const crossesBoardHalves = (from.y - centerY) * (to.y - centerY) < 0;
      let targetStackHeight = 0;
      if (toTargetId === "bar-top" || toTargetId === "bar-bottom") {
        targetStackHeight = (toTargetId === "bar-top" ? barStacks.top.length : barStacks.bottom.length);
      } else {
        const toPointIndex = Number(toTargetId);
        if (Number.isInteger(toPointIndex) && toPointIndex >= 0 && toPointIndex < pointStacks.length) {
          targetStackHeight = pointStacks[toPointIndex].length;
        }
      }
      let crossCurveDamping = 1;
      let centerFocus = 0;
      if (crossesBoardHalves) {
        // For cross-half arrows, keep the tail cleaner near destination.
        // Tall destination towers need even less horizontal pull at the endpoint.
        // Tall source towers also require flatter curvature near start.
        const sourceTallness = Math.max(0, sourceStackHeight - 1);
        const targetTallness = Math.max(0, targetStackHeight - 1);
        const crossHalfDamping = 0.45;
        const tallSourceDamping = Math.max(0.34, 1 - sourceTallness * 0.11);
        const tallTargetDamping = Math.max(0.4, 1 - targetTallness * 0.1);
        crossCurveDamping = tallSourceDamping;
        // For top-to-bottom transitions, keep bend nearer to the line middle.
        centerFocus = Math.min(0.5, 0.22 + sourceTallness * 0.045);
        endBias *= crossHalfDamping * tallTargetDamping * tallSourceDamping;
      }
      const adjustedBaseControlX = midX + (baseControlX - midX) * crossCurveDamping;
      const adjustedBaseControlY = midY + (baseControlY - midY) * crossCurveDamping;
      const centeredControlX = adjustedBaseControlX + (to.x - midX) * endBias;
      const centeredControlY = adjustedBaseControlY + (to.y - midY) * endBias;
      const cx = centeredControlX + (midX - centeredControlX) * centerFocus;
      const cy = centeredControlY + (midY - centeredControlY) * centerFocus;

      return {
        from,
        control: { x: cx, y: cy },
        end: { x: to.x, y: to.y }
      };
    }

    function pointOnQuadratic(p0, p1, p2, t) {
      const oneMinusT = 1 - t;
      return {
        x: oneMinusT * oneMinusT * p0.x + 2 * oneMinusT * t * p1.x + t * t * p2.x,
        y: oneMinusT * oneMinusT * p0.y + 2 * oneMinusT * t * p1.y + t * t * p2.y
      };
    }

    function tangentOnQuadratic(p0, p1, p2, t) {
      return {
        x: 2 * (1 - t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x),
        y: 2 * (1 - t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y)
      };
    }

    function createArrowShapePath(fromTargetId, toTargetId) {
      const geometry = getArrowGeometry(fromTargetId, toTargetId);
      const p0 = geometry.from;
      const p1 = geometry.control;
      const p2 = geometry.end;
      const samples = 20;
      const left = [];
      const right = [];

      for (let i = 0; i <= samples; i += 1) {
        const t = i / samples;
        const point = pointOnQuadratic(p0, p1, p2, t);
        const tangent = tangentOnQuadratic(p0, p1, p2, t);
        const tangentLen = Math.hypot(tangent.x, tangent.y) || 1;
        const nx = -tangent.y / tangentLen;
        const ny = tangent.x / tangentLen;
        const currentWidth = arrowStartWidth + (arrowEndWidth - arrowStartWidth) * t;
        const halfWidth = currentWidth / 2;
        left.push({ x: point.x + nx * halfWidth, y: point.y + ny * halfWidth });
        right.push({ x: point.x - nx * halfWidth, y: point.y - ny * halfWidth });
      }

      let d = `M ${left[0].x} ${left[0].y}`;
      for (let i = 1; i < left.length; i += 1) {
        d += ` L ${left[i].x} ${left[i].y}`;
      }
      const endRadius = arrowEndWidth / 2;
      const endTangent = tangentOnQuadratic(p0, p1, p2, 1);
      const endTangentLen = Math.hypot(endTangent.x, endTangent.y) || 1;
      const tx = endTangent.x / endTangentLen;
      const ty = endTangent.y / endTangentLen;
      const rightEnd = right[right.length - 1];
      const outerEnd = { x: p2.x + tx * endRadius, y: p2.y + ty * endRadius };
      d += ` Q ${outerEnd.x} ${outerEnd.y} ${rightEnd.x} ${rightEnd.y}`;
      for (let i = right.length - 1; i >= 0; i -= 1) {
        d += ` L ${right[i].x} ${right[i].y}`;
      }
      const startRadius = arrowStartWidth / 2;
      const startTangent = tangentOnQuadratic(p0, p1, p2, 0);
      const startTangentLen = Math.hypot(startTangent.x, startTangent.y) || 1;
      const sx = startTangent.x / startTangentLen;
      const sy = startTangent.y / startTangentLen;
      const leftStart = left[0];
      const outerStart = { x: p0.x - sx * startRadius, y: p0.y - sy * startRadius };
      d += ` Q ${outerStart.x} ${outerStart.y} ${leftStart.x} ${leftStart.y}`;
      d += " Z";
      return d;
    }

    function drawArrows() {
      arrowsLayer.replaceChildren();
      arrowDefs.replaceChildren();
      arrowHitLayer.replaceChildren();

      arrows.forEach((arrow) => {
        const geometry = getArrowGeometry(arrow.from, arrow.to);
        const gradient = document.createElementNS(svgNs, "linearGradient");
        const gradientId = `arrowGradient-${arrow.id}`;
        gradient.setAttribute("id", gradientId);
        gradient.setAttribute("gradientUnits", "userSpaceOnUse");
        gradient.setAttribute("x1", String(geometry.from.x));
        gradient.setAttribute("y1", String(geometry.from.y));
        gradient.setAttribute("x2", String(geometry.end.x));
        gradient.setAttribute("y2", String(geometry.end.y));
        const startStop = document.createElementNS(svgNs, "stop");
        startStop.setAttribute("offset", "0%");
        startStop.setAttribute("stop-color", "#f0f0ff");
        startStop.setAttribute("stop-opacity", "0.03");
        const endStop = document.createElementNS(svgNs, "stop");
        endStop.setAttribute("offset", "100%");
        endStop.setAttribute("stop-color", "#f0f0ff");
        endStop.setAttribute("stop-opacity", "0.6");
        gradient.appendChild(startStop);
        gradient.appendChild(endStop);
        arrowDefs.appendChild(gradient);

        const path = document.createElementNS(svgNs, "path");
        path.setAttribute("d", createArrowShapePath(arrow.from, arrow.to));
        path.setAttribute("fill", `url(#${gradientId})`);
        path.setAttribute("pointer-events", "none");
        arrowsLayer.appendChild(path);

        const hitPath = document.createElementNS(svgNs, "path");
        hitPath.setAttribute("d", createArrowShapePath(arrow.from, arrow.to));
        hitPath.setAttribute("fill", "none");
        hitPath.setAttribute("stroke", "transparent");
        hitPath.setAttribute("stroke-width", String(Math.max(16, cellWidth * 0.45)));
        hitPath.setAttribute("pointer-events", editMode === "delete" ? "stroke" : "none");
        hitPath.addEventListener("mousedown", (event) => {
          if (editMode !== "delete" || event.button !== 0) {
            return;
          }
          removeArrowById(arrow.id);
          event.preventDefault();
          event.stopPropagation();
        });
        arrowHitLayer.appendChild(hitPath);
      });
    }

    function drawLineStartMarker() {
      lineSelectionLayer.replaceChildren();
      if (editMode === "lines" && lineStartPointIndex !== null) {
        const anchor = getAnchorForArrow(lineStartPointIndex, false);
        const marker = document.createElementNS(svgNs, "circle");
        marker.setAttribute("cx", String(anchor.x));
        marker.setAttribute("cy", String(anchor.y));
        marker.setAttribute("r", "9");
        marker.setAttribute("fill", "rgba(255,255,255,0.85)");
        marker.setAttribute("stroke", "#506884");
        marker.setAttribute("stroke-width", "2");
        lineSelectionLayer.appendChild(marker);
      }
    }

    function recordEditAction(action) {
      editHistory.push(action);
      redoHistory.length = 0;
    }

    function getDiceFromInputs() {
      return {
        die1: String(dieOneInput.value),
        die2: String(dieTwoInput.value),
        cube: String(cubeValueInput.value)
      };
    }

    function syncDiceSnapshotFromInputs() {
      diceSnapshot = getDiceFromInputs();
    }

    function recordDiceChangeIfNeeded() {
      const next = getDiceFromInputs();
      if (next.die1 === diceSnapshot.die1 && next.die2 === diceSnapshot.die2) {
        return;
      }
      shouldAnimateDice = true;
      recordEditAction({
        type: "diceCube",
        prev: { ...diceSnapshot },
        next: { ...next }
      });
      renderBoard();
      syncDiceSnapshotFromInputs();
    }

    function recordDoublingCubeChangeIfNeeded() {
      const next = getDiceFromInputs();
      if (next.cube === diceSnapshot.cube) {
        return;
      }
      shouldAnimateDoublingCube = true;
      recordEditAction({
        type: "diceCube",
        prev: { ...diceSnapshot },
        next: { ...next }
      });
      renderBoard();
      syncDiceSnapshotFromInputs();
    }

    function queueTowerShiftAnimation(pointIndexLike, fromCount, toCount) {
      const pointIndex = Number(pointIndexLike);
      if (!Number.isInteger(pointIndex) || pointIndex < 0 || pointIndex >= pointDefs.length) {
        return;
      }
      if (fromCount === toCount) {
        return;
      }
      pendingTowerShiftAnimations.set(pointIndex, { fromCount, toCount });
    }

    function isBarPointId(pointId) {
      return pointId === "bar-top" || pointId === "bar-bottom";
    }

    function getPointStackById(pointId) {
      if (isBarPointId(pointId)) {
        return pointId === "bar-top" ? barStacks.top : barStacks.bottom;
      }
      const pointIndex = Number(pointId);
      if (!Number.isInteger(pointIndex) || pointIndex < 0 || pointIndex >= pointDefs.length) {
        return null;
      }
      return pointStacks[pointIndex];
    }

    function getTopCheckerColor(pointId) {
      const stack = getPointStackById(pointId);
      if (!stack || stack.length === 0) {
        return null;
      }
      return stack[stack.length - 1];
    }

    function popTopChecker(pointId) {
      const stack = getPointStackById(pointId);
      if (!stack || stack.length === 0) {
        return null;
      }
      return stack.pop();
    }

    function pushChecker(pointId, color) {
      const stack = getPointStackById(pointId);
      if (!stack) {
        return;
      }
      stack.push(color);
    }

    function getCheckerPlacementAnchor(pointId, colorForPlacement = "white") {
      if (isBarPointId(pointId)) {
        return {
          x: barX,
          y: pointId === "bar-top" ? barTopY : barBottomY
        };
      }
      const pointIndex = Number(pointId);
      const point = pointDefs[pointIndex];
      const stack = pointStacks[pointIndex];
      const nextCount = stack.length + 1;
      const step = nextCount <= 5 ? defaultStep : Math.min(defaultStep, maxTowerSpan / (nextCount - 1));
      return {
        x: point.x,
        y: point.startY + point.direction * (nextCount - 1) * step,
        color: colorForPlacement
      };
    }

    function animateCheckerMove(color, fromAnchor, toAnchor) {
      const style = checkerStyleForColor(color);
      const animatedChecker = document.createElementNS(svgNs, "circle");
      animatedChecker.setAttribute("r", String(radius));
      animatedChecker.setAttribute("fill", style.fill);
      animatedChecker.setAttribute("stroke", style.stroke);
      animatedChecker.setAttribute("stroke-width", "3");
      checkersOverArrowsLayer.appendChild(animatedChecker);

      return new Promise((resolve) => {
        const durationMs = 180;
        const startTs = performance.now();

        function tick(now) {
          const t = Math.min(1, (now - startTs) / durationMs);
          const eased = 1 - Math.pow(1 - t, 3);
          const x = fromAnchor.x + (toAnchor.x - fromAnchor.x) * eased;
          const y = fromAnchor.y + (toAnchor.y - fromAnchor.y) * eased;
          animatedChecker.setAttribute("cx", String(x));
          animatedChecker.setAttribute("cy", String(y));
          if (t < 1) {
            requestAnimationFrame(tick);
            return;
          }
          animatedChecker.remove();
          resolve();
        }

        requestAnimationFrame(tick);
      });
    }

    function animateClearToColumnBaseAndRemove() {
      const exitingCheckers = [];
      for (let pointIndex = 0; pointIndex < pointStacks.length; pointIndex += 1) {
        const stack = pointStacks[pointIndex];
        if (!stack || stack.length === 0) {
          continue;
        }
        const point = pointDefs[pointIndex];
        const step = getTowerStep(stack.length);
        for (let i = 0; i < stack.length; i += 1) {
          const style = checkerStyleForColor(stack[i]);
          const cx = point.x;
          const cy = point.startY + point.direction * i * step;
          exitingCheckers.push({ cx, cy, targetY: point.startY, style });
        }
      }
      if (exitingCheckers.length === 0) {
        return;
      }

      // Hide rendered stacks so only clear animation is visible.
      checkersUnderArrowsLayer.replaceChildren();
      checkersOverArrowsLayer.replaceChildren();
      countLabelsLayer.replaceChildren();

      const animatedNodes = exitingCheckers.map((checker) => {
        const circle = document.createElementNS(svgNs, "circle");
        circle.setAttribute("r", String(radius));
        circle.setAttribute("cx", String(checker.cx));
        circle.setAttribute("cy", String(checker.cy));
        circle.setAttribute("fill", checker.style.fill);
        circle.setAttribute("stroke", checker.style.stroke);
        circle.setAttribute("stroke-width", "3");
        checkersOverArrowsLayer.appendChild(circle);
        return { node: circle, checker };
      });

      animatedNodes.forEach(({ node, checker }) => {
        if (typeof node.animate !== "function") {
          node.remove();
          return;
        }
        const deltaY = checker.targetY - checker.cy;
        if (Math.abs(deltaY) < 0.01) {
          node.remove();
          return;
        }
        const anim = node.animate(
          [
            { transform: "translateY(0px)" },
            { transform: `translateY(${deltaY}px)` }
          ],
          {
            duration: 340,
            easing: "cubic-bezier(0.22, 1, 0.36, 1)",
            fill: "forwards"
          }
        );
        anim.addEventListener("finish", () => node.remove());
      });
    }

    function addCheckerToBar(section, color) {
      if (section !== "top" && section !== "bottom") {
        return;
      }
      if (color !== "white" && color !== "black") {
        return;
      }
      barStacks[section].push(color);
      recordEditAction({ type: "addBar", section, color });
      playSound(soundMove);
      renderBoard();
    }

    function removeCheckerFromBar(section) {
      if (section !== "top" && section !== "bottom") {
        return false;
      }
      const stack = barStacks[section];
      if (stack.length === 0) {
        return false;
      }
      const color = stack.pop();
      recordEditAction({ type: "deleteBar", section, color });
      playSound(soundCheck);
      renderBoard();
      return true;
    }

    function renderBoard() {
      checkersUnderArrowsLayer.replaceChildren();
      checkersOverArrowsLayer.replaceChildren();
      countLabelsLayer.replaceChildren();
      extrasLayer.replaceChildren();

      pointStacks.forEach((stack, idx) => drawTower(idx, stack));
      pendingTowerShiftAnimations.clear();
      drawBarCheckers();
      drawArrows();
      drawLineStartMarker();

      const dieSize = currentDiceSize;
      const currentFieldHeight = baseFieldHeight - boardFieldHeightOffset;
      const fieldMiddleY = baseFieldTopY + currentFieldHeight / 2;
      const diceY = fieldMiddleY - dieSize / 2;
      const doublingCubeY = fieldMiddleY - dieSize / 2;
      const diceGap = dieSize / 2;
      const dicePairWidth = dieSize * 2 + diceGap;
      const dieOneX = baseDicePairCenterX - dicePairWidth / 2;
      const dieTwoX = dieOneX + dieSize + diceGap;
      const doublingCubeX = doublingCubeCenterX - dieSize / 2;
      const dieOne = clampInt(dieOneInput.value, 0, 6, 0);
      const dieTwo = clampInt(dieTwoInput.value, 0, 6, 0);
      dieOneInput.value = String(dieOne);
      dieTwoInput.value = String(dieTwo);
      if (!isDiceRollTransition && dieOne > 0) {
        drawDie(dieOneX, diceY, dieSize, dieOne, shouldAnimateDice, 0);
      }
      if (!isDiceRollTransition && dieTwo > 0) {
        drawDie(dieTwoX, diceY, dieSize, dieTwo, shouldAnimateDice, 70);
      }

      const cubeValue = clampInt(cubeValueInput.value, 0, 64, 0);
      cubeValueInput.value = String(cubeValue);
      if (cubeValue > 0) {
        drawDoublingCube(cubeValue, doublingCubeX, doublingCubeY, dieSize, shouldAnimateDoublingCube);
      }
      shouldAnimateDice = false;
      shouldAnimateDoublingCube = false;
    }

    function editPoint(pointIndex) {
      const stack = pointStacks[pointIndex];
      if (editMode === "white") {
        const prevCount = stack.length;
        stack.push("white");
        recordEditAction({ type: "add", pointIndex, color: "white" });
        queueTowerShiftAnimation(pointIndex, prevCount, stack.length);
        playSound(soundMove);
      } else if (editMode === "black") {
        const prevCount = stack.length;
        stack.push("black");
        recordEditAction({ type: "add", pointIndex, color: "black" });
        queueTowerShiftAnimation(pointIndex, prevCount, stack.length);
        playSound(soundMove);
      }
      renderBoard();
    }

    function deleteOneChecker(pointIndexLike) {
      const pointIndex = Number(pointIndexLike);
      if (!Number.isInteger(pointIndex) || pointIndex < 0 || pointIndex >= pointDefs.length) {
        return false;
      }
      const stack = pointStacks[pointIndex];
      if (stack.length === 0) {
        return false;
      }
      const prevCount = stack.length;
      const deletedColor = stack.pop();
      recordEditAction({ type: "delete", pointIndex, color: deletedColor });
      queueTowerShiftAnimation(pointIndex, prevCount, stack.length);
      playSound(soundCheck);
      renderBoard();
      return true;
    }

    function removeArrowById(arrowId) {
      const idx = arrows.findIndex((arrow) => arrow.id === arrowId);
      if (idx === -1) {
        return false;
      }
      const [removedArrow] = arrows.splice(idx, 1);
      recordEditAction({ type: "deleteArrow", arrow: removedArrow });
      if (lineStartPointIndex !== null && (lineStartPointIndex === removedArrow.from || lineStartPointIndex === removedArrow.to)) {
        lineStartPointIndex = null;
      }
      renderBoard();
      return true;
    }

    function removeLastArrowForPoint(pointId) {
      for (let i = arrows.length - 1; i >= 0; i -= 1) {
        const arrow = arrows[i];
        if (arrow.from !== pointId && arrow.to !== pointId) {
          continue;
        }
        return removeArrowById(arrow.id);
      }
      return false;
    }

    function deleteFromPoint(pointId) {
      if (pointId === "bar-top") {
        removeCheckerFromBar("top");
        return;
      }
      if (pointId === "bar-bottom") {
        removeCheckerFromBar("bottom");
        return;
      }
      if (deleteOneChecker(pointId)) {
        return;
      }
      removeLastArrowForPoint(pointId);
    }

    function handleLinePoint(pointId) {
      if (lineStartPointIndex === null) {
        lineStartPointIndex = pointId;
        renderBoard();
        return;
      }

      if (lineStartPointIndex === pointId) {
        lineStartPointIndex = null;
        renderBoard();
        return;
      }

      const arrow = {
        id: nextArrowId,
        from: lineStartPointIndex,
        to: pointId
      };
      nextArrowId += 1;
      arrows.push(arrow);
      recordEditAction({ type: "addArrow", arrow });
      lineStartPointIndex = null;
      renderBoard();
    }

    async function handleMovePoint(pointId) {
      if (isMoveAnimating) {
        return;
      }

      if (moveStartPointId === null) {
        if (!getTopCheckerColor(pointId)) {
          return;
        }
        moveStartPointId = pointId;
        renderBoard();
        return;
      }

      if (moveStartPointId === pointId) {
        moveStartPointId = null;
        renderBoard();
        return;
      }

      const fromPointId = moveStartPointId;
      const color = getTopCheckerColor(fromPointId);
      if (!color) {
        moveStartPointId = null;
        renderBoard();
        return;
      }

      const fromAnchor = getAnchorForArrow(fromPointId, false);
      const fromStack = getPointStackById(fromPointId);
      const toStack = getPointStackById(pointId);
      const fromPrevCount = fromStack ? fromStack.length : 0;
      const toPrevCount = toStack ? toStack.length : 0;
      const movedColor = popTopChecker(fromPointId);
      const toAnchor = getCheckerPlacementAnchor(pointId, movedColor || color);
      isMoveAnimating = true;
      moveStartPointId = null;
      pushChecker(pointId, movedColor || color);
      moveInFlight = { toPointId: pointId, color: movedColor || color };
      queueTowerShiftAnimation(pointId, toPrevCount, toPrevCount + 1);
      queueTowerShiftAnimation(fromPointId, fromPrevCount, Math.max(0, fromPrevCount - 1));
      if (pointId === "bar-top" || pointId === "bar-bottom") {
        playSound(soundCheck);
      } else {
        playSound(soundMove);
      }
      renderBoard();
      await animateCheckerMove(movedColor || color, fromAnchor, toAnchor);
      moveInFlight = null;
      recordEditAction({ type: "moveChecker", from: fromPointId, to: pointId, color: movedColor || color });
      isMoveAnimating = false;
      renderBoard();
    }

    async function undoLastEdit() {
      if (isMoveAnimating) {
        return;
      }
      if (lineStartPointIndex !== null) {
        redoHistory.push({ type: "lineStartSelection", pointIndex: lineStartPointIndex });
        lineStartPointIndex = null;
        renderBoard();
        return;
      }

      const lastAction = editHistory.pop();
      if (!lastAction) {
        return;
      }

      if (lastAction.type === "diceCube") {
        dieOneInput.value = lastAction.prev.die1;
        dieTwoInput.value = lastAction.prev.die2;
        cubeValueInput.value = lastAction.prev.cube;
        redoHistory.push(lastAction);
        renderBoard();
        syncDiceSnapshotFromInputs();
        return;
      }

      if (lastAction.type === "addBar") {
        const stack = barStacks[lastAction.section];
        if (stack.length > 0) {
          stack.pop();
        }
        redoHistory.push(lastAction);
        renderBoard();
        return;
      }
      if (lastAction.type === "deleteBar") {
        barStacks[lastAction.section].push(lastAction.color);
        redoHistory.push(lastAction);
        renderBoard();
        return;
      }
      if (lastAction.type === "moveChecker") {
        const fromStack = getPointStackById(lastAction.from);
        const toStack = getPointStackById(lastAction.to);
        const fromPrevCount = fromStack ? fromStack.length : 0;
        const toPrevCount = toStack ? toStack.length : 0;
        const reverseFromAnchor = getAnchorForArrow(lastAction.to, false);
        const moved = popTopChecker(lastAction.to);
        queueTowerShiftAnimation(lastAction.to, toPrevCount, Math.max(0, toPrevCount - 1));
        queueTowerShiftAnimation(lastAction.from, fromPrevCount, fromPrevCount + 1);
        if (moved) {
          const reverseToAnchor = getCheckerPlacementAnchor(lastAction.from, moved);
          isMoveAnimating = true;
          pushChecker(lastAction.from, moved);
          moveInFlight = { toPointId: lastAction.from, color: moved };
          if (lastAction.from === "bar-top" || lastAction.from === "bar-bottom") {
            playSound(soundCheck);
          } else {
            playSound(soundMove);
          }
          renderBoard();
          await animateCheckerMove(moved, reverseFromAnchor, reverseToAnchor);
          moveInFlight = null;
          isMoveAnimating = false;
        }
        moveStartPointId = null;
        redoHistory.push(lastAction);
        renderBoard();
        return;
      }

      const stack = pointStacks[lastAction.pointIndex];
      if (lastAction.type === "add") {
        const prevCount = stack.length;
        if (stack.length > 0) {
          stack.pop();
        }
        queueTowerShiftAnimation(lastAction.pointIndex, prevCount, stack.length);
      } else if (lastAction.type === "delete") {
        const prevCount = stack.length;
        stack.push(lastAction.color);
        queueTowerShiftAnimation(lastAction.pointIndex, prevCount, stack.length);
      } else if (lastAction.type === "addArrow") {
        const idx = arrows.findIndex((arrow) => arrow.id === lastAction.arrow.id);
        if (idx !== -1) {
          arrows.splice(idx, 1);
        }
      } else if (lastAction.type === "deleteArrow") {
        arrows.push(lastAction.arrow);
      }
      redoHistory.push(lastAction);
      renderBoard();
    }

    function redoLastEdit() {
      const redoAction = redoHistory.pop();
      if (!redoAction) {
        return;
      }

      if (redoAction.type === "lineStartSelection") {
        lineStartPointIndex = redoAction.pointIndex;
        renderBoard();
        return;
      }

      if (redoAction.type === "diceCube") {
        dieOneInput.value = redoAction.next.die1;
        dieTwoInput.value = redoAction.next.die2;
        cubeValueInput.value = redoAction.next.cube;
        editHistory.push(redoAction);
        renderBoard();
        syncDiceSnapshotFromInputs();
        return;
      }

      if (redoAction.type === "addBar") {
        barStacks[redoAction.section].push(redoAction.color);
        editHistory.push(redoAction);
        renderBoard();
        return;
      }
      if (redoAction.type === "deleteBar") {
        const stack = barStacks[redoAction.section];
        if (stack.length > 0) {
          stack.pop();
        }
        editHistory.push(redoAction);
        renderBoard();
        return;
      }
      if (redoAction.type === "moveChecker") {
        const fromStack = getPointStackById(redoAction.from);
        const toStack = getPointStackById(redoAction.to);
        const fromPrevCount = fromStack ? fromStack.length : 0;
        const toPrevCount = toStack ? toStack.length : 0;
        const moved = popTopChecker(redoAction.from);
        if (moved) {
          pushChecker(redoAction.to, moved);
        }
        queueTowerShiftAnimation(redoAction.from, fromPrevCount, Math.max(0, fromPrevCount - 1));
        queueTowerShiftAnimation(redoAction.to, toPrevCount, toPrevCount + 1);
        moveStartPointId = null;
        editHistory.push(redoAction);
        renderBoard();
        return;
      }

      const stack = pointStacks[redoAction.pointIndex];
      if (redoAction.type === "add") {
        const prevCount = stack.length;
        stack.push(redoAction.color);
        queueTowerShiftAnimation(redoAction.pointIndex, prevCount, stack.length);
      } else if (redoAction.type === "delete") {
        const prevCount = stack.length;
        if (stack.length > 0) {
          stack.pop();
        }
        queueTowerShiftAnimation(redoAction.pointIndex, prevCount, stack.length);
      } else if (redoAction.type === "addArrow") {
        arrows.push(redoAction.arrow);
      } else if (redoAction.type === "deleteArrow") {
        const idx = arrows.findIndex((arrow) => arrow.id === redoAction.arrow.id);
        if (idx !== -1) {
          arrows.splice(idx, 1);
        }
      }
      editHistory.push(redoAction);
      renderBoard();
    }

    function finishClearBoardState(shouldRender = true) {
      pointStacks.forEach((stack) => {
        stack.length = 0;
      });
      barStacks.top.length = 0;
      barStacks.bottom.length = 0;
      arrows.length = 0;
      lineStartPointIndex = null;
      moveStartPointId = null;
      moveInFlight = null;
      editHistory.length = 0;
      redoHistory.length = 0;
      isDeleteDragging = false;
      stopDeleteHold();
      dieOneInput.value = "0";
      dieTwoInput.value = "0";
      cubeValueInput.value = "0";

    function runStackBuildupAnimation(targetPerPoint) {
      let any = false;
      for (let i = 0; i < pointStacks.length; i += 1) {
        const tgt = targetPerPoint[i];
        if (tgt.length === 0) {
          continue;
        }
        any = true;
        const stack = pointStacks[i];
        stack.length = 0;
        for (let j = 0; j < tgt.length; j += 1) {
          stack.push(tgt[j]);
        }
        queueTowerShiftAnimation(i, 0, stack.length);
      }
      if (!any) {

    function prepareBoardSvgForExport() {
